.\"; Proatividade — \"Antecipa problemas nos indicadores antes que afetem o atendimento.\"\n- Card \"**Oportunidades de desenvolvimento**\" (ícone 💡): Conhecimento técnico — \"Aprofundar o uso das ferramentas de análise de dados.\"; Resiliência — \"Manter o foco quando as prioridades mudam no meio da semana.\"; Liderança e influência — \"Assumir a condução das reuniões de acompanhamento.\"\n**APEX**: KPIs = Static Content/Badge; comparativo = **Chart** (JET) Bar horizontal com 3 séries (ou HTML de barras); evolução = Chart Bar vertical; \"Ver em tabela\" alterna para Classic Report; pontos fortes/oportunidades = Content Row/Media List.\n\n### 4.25 Feedbacks · Recebidos — `Feedbacks.png` → não implementada\nUsuário: Rafael Nunes. Cabeçalho \"Feedbacks\" / \"Registros entre os ciclos de avaliação, ligados às competências.\" + botão \"⊞ **Dar feedback**\" (abre drawer).\n- Abas \"**Recebidos · 3**\" | \"Enviados · 2\" + select \"Competência: Todas\".\n- **Cards de feedback**: avatar + nome do autor + relação (\"Gestão direta\", \"Colega de equipe\", \"Vendas\"); data à direita (\"19/09/2026\"); etiquetas: tipo com ícone (\"🎖 Reconhecimento\" ou \"💡 Sugestão\") + competência (\"Comunicação assertiva\"); texto do feedback; rodapé: 🔒 visibilidade (\"Visível para você e sua linha de gestão\" / \"Só você\") e link \"**Agradecer ♡**\".\n  Exemplos: Ana Beatriz Souza — Reconhecimento/Comunicação assertiva — \"A apresentação dos indicadores na reunião de segunda foi clara e ajudou o time a decidir rápido o que priorizar.\"; Bruno Carvalho — Sugestão/Conhecimento técnico — \"Vale automatizar a planilha de filas. Posso mostrar como fiz no relatório mensal.\"; Camila Rocha — Reconhecimento/Trabalho em equipe — \"Agradeço por cobrir os chamados de vendas no pico do fim do mês. Fez diferença para o time.\"\n- Coluna direita: card \"**No 3º tri 2026**\" (Recebidos 3; Enviados 2; — Reconhecimentos 2; Sugestões 1; — \"Por competência\": Comunicação assertiva 1; Conhecimento técnico 1; Trabalho em equipe 1). Card \"**Como dar um bom feedback**\": **Situação** — Quando e onde aconteceu.; **Comportamento** — O que a pessoa fez, sem julgamentos.; **Impacto** — O efeito no time ou no resultado.\n**APEX**: Tabs (Region Display Selector) com 2 regiões **Cards**/Content Row; \"Agradecer\" = DA AJAX; resumo = Classic Report key/value.\n\n### 4.26 Feedbacks · Enviados — `Feedbacks · aba Enviados.png` → não implementada\nMesma página, aba \"**Enviados · 2**\". Cards com \"Para Bruno Carvalho / Colega de equipe\" e data \"Hoje, 10:15\"; etiquetas \"🎖 Reconhecimento\" \"Trabalho em equipe\"; texto \"Na virada do mês, você reorganizou a fila de chamados sem que ninguém pedisse. O time zerou o atraso em dois dias.\"; rodapé \"🔒 Só a pessoa\" e, enquanto dentro de 24 h, \"Pode ser excluído até 26/09 às 10:15\" + link vermelho \"**Excluir 🗑**\". Segundo card: \"Para Lucas Almeida / Vendas\" \"02/09/2026\", \"💡 Sugestão\" \"Comunicação assertiva\", \"Nas passagens de turno, vale registrar os chamados pendentes no canal da equipe para ninguém perder o contexto.\", \"🔒 A pessoa e a linha de gestão dela\", à direita \"♡ Lucas agradeceu\" (estado de agradecimento recebido).\n\n### 4.27 Feedbacks · Dar feedback (Drawer) — `Feedbacks · dar feedback (Drawer).png` → não implementada\n**Drawer** \"Dar feedback\" + ×. \"Campos marcados com * são obrigatórios.\"\n- **Para quem *** (Popup LOV com lupa; valor \"Bruno Carvalho\"; ajuda \"Busque pelo nome de qualquer colaborador.\").\n- **Tipo *** — segmentado \"🎖 **Reconhecimento**\" (selecionado, escuro) | \"💡 Sugestão\".\n- **Competência** (Select; \"Trabalho em equipe\"; ajuda \"Opcional. Liga o feedback às competências do 360.\").\n- **Feedback *** (Textarea; ajuda \"Situação, comportamento e impacto. 114 de 1.000 caracteres.\" — contador, máx. 1000).\n- **Quem pode ver *** — Radio: ◉ \"Só a pessoa\" / ○ \"A pessoa e a linha de gestão dela\".\n- Alerta info: \"**Feedbacks não são anônimos nem editáveis.** A pessoa vê quem enviou. Depois do envio, você pode excluir em até 24 horas.\"\n- Rodapé: \"Cancelar\" + \"**Enviar feedback**\".\n\n---\n\n## 5. Funcionalidades presentes no design mas sem backend ainda\n\n| Funcionalidade | Telas | Entidades de dados necessárias (sugestão) |\n|---|---|---|\n| **Busca global** | Busca (resultados), header | Nenhuma tabela nova obrigatória: consulta sobre colaboradores (ativos), comunicados (com regra de visibilidade por público) e menu/páginas autorizadas. Opcional: Search Configuration do APEX, índice Oracle Text. Build Option \"Busca na intranet\". |\n| **Links rápidos** | Início (Holerite digital, Ponto eletrônico, Suporte TI), Configurações | `LINK_RAPIDO` (id, empresa_id, titulo, icone, url, ordem, ativo). |\n| **Notificações (sino)** | Header, Configurações | `NOTIFICACAO` (id, colaborador_id, tipo, titulo, link, lida_em, criado_em) — páginas p00005/p00008 já existem, falta modelo/integração. |\n| **Comunicados: categorias, leitura, fixar, anexo, público** | Comunicados, Novo comunicado | `CATEGORIA_COMUNICADO` (id, nome); colunas em `COMUNICADO`: categoria_id, publico_tipo (TODOS/EMPRESA/DEPARTAMENTO), empresa_id, departamento_id, fixado, imagem BLOB/mime, anexo; `COMUNICADO_LEITURA` (comunicado_id, colaborador_id, lido_em); `COMUNICADO_ANEXO` (id, comunicado_id, nome, blob, mime). |\n| **Foto de perfil** | Meu perfil (drawer) | Colunas `FOTO` BLOB, `FOTO_MIME`, `FOTO_ATUALIZADA_EM` em colaborador. |\n| **Cargos / Departamentos como cadastros de apoio** | Novo/Editar colaborador, Configurações | `DEPARTAMENTO` (id, empresa_id, nome), `CARGO` (id, empresa_id/departamento_id, nome); colaborador com gestor_id (auto-relacionamento), topo_hierarquia, data_admissao, data_nascimento, perfis (publicador, administrador), situação. |\n| **Histórico de carreira** | Histórico de carreira, Meu perfil (Trajetória) | `MOVIMENTACAO_CARREIRA` (id, colaborador_id, tipo [ADMISSAO, PROMOCAO, MUDANCA_GESTAO, CONTRATO, REMUNERACAO, TEMPO_CASA, PDI, AVALIACAO], data_vigencia, titulo, descricao, cargo_anterior_id, cargo_novo_id, gestor_anterior_id, gestor_novo_id, departamento_*, visibilidade [COLEGAS/GESTAO/RH], registrado_por, registrado_em, aprovado_por, comunicado_id); `SOLICITACAO_CORRECAO` (id, colaborador_id, movimentacao_id, texto, status). Ver `modulos/historico-carreira/`. |\n| **Avaliações 360** | Avaliações (pares), Resultados 360, Minha equipe, Configurações | `COMPETENCIA` (id, nome, descricao); `COMPETENCIA_CARGO` (cargo_id ou departamento_id, competencia_id, ordem); `CICLO_AVALIACAO` (id, nome \"3º tri 2026\", inicio, fim, prazo_auto, prazo_pares, prazo_gestor, libera_resultado_em, status); `AVALIACAO` (id, ciclo_id, avaliado_id, avaliador_id, tipo [AUTO/PAR/GESTOR], status [PENDENTE/EM_ANDAMENTO/CONCLUIDA/ATRASADA], rascunho_salvo_em, enviada_em); `AVALIACAO_RESPOSTA` (avaliacao_id, competencia_id, nota 1–5, exemplos); `RESULTADO_360` (ciclo_id, colaborador_id, nota_geral, percentil, pontos fortes/oportunidades — pode ser view materializada) + parâmetros (grupo mínimo percentil, respostas mínimas de pares). |\n| **PDI — Plano de desenvolvimento** | Plano de desenvolvimento, Novo objetivo, PDI aprovação, Resultados 360 (\"Criar PDI\") | `PDI` (id, colaborador_id, ciclo_origem_id, prazo, status [RASCUNHO/AGUARDANDO/APROVADO/AJUSTES], enviado_em, aprovado_por, aprovado_em, proxima_conversa); `PDI_OBJETIVO` (id, pdi_id, competencia_id, titulo, resultado_esperado, prazo, status [NAO_INICIADO/EM_ANDAMENTO/CONCLUIDO], aprovado); `PDI_ACAO` (id, objetivo_id, descricao, prazo, concluida_em); `PDI_SOLICITACAO_PRAZO` (objetivo_id, prazo_atual, prazo_novo, motivo, status). |\n| **Minhas aprovações** | Minhas aprovações, PDI aprovação | Preferencialmente **APEX Human Tasks** (Task Definitions \"Aprovar PDI\", \"Novo objetivo\", \"Alterar prazo\"; tabelas internas `APEX_TASKS`), ou tabela própria `SOLICITACAO_APROVACAO` (id, tipo, solicitante_id, aprovador_id, referencia_id, payload, prazo_resposta, status, comentario, decidido_em). |\n| **Feedbacks** | Feedbacks (Recebidos/Enviados/Drawer) | `FEEDBACK` (id, autor_id, destinatario_id, tipo [RECONHECIMENTO/SUGESTAO], competencia_id nullable, texto ≤1000, visibilidade [PESSOA/PESSOA_E_GESTAO], criado_em, excluido_em, agradecido_em). Regra: excluir só até 24 h. |\n| **Minha equipe** | Minha equipe | Reaproveita colaborador.gestor_id (hierarquia `connect by`), `MOVIMENTACAO_CARREIRA` (última movimentação) e `AVALIACAO` (status do ciclo). |\n| **Monitor de logs — detalhe** | Drawer de log | Tabela de log da `log_pkg` precisa de: sessão, aplicação, componente técnico, mensagem completa, mensagem exibida ao usuário, flag \"viu mensagem técnica\"; cruzamento com `APEX_WORKSPACE_ACTIVITY_LOG` / `APEX_DEBUG_MESSAGES`. |\n| **Configurações: Recursos e Parâmetros** | Configurações | **Build Options** (Configuration Options) para Busca, Links rápidos, Notificações, Avaliações 360, Exportação PDF, PDI, Feedbacks; **Application Settings** para empresa padrão, retenção de log (dias), tamanho máx. de imagem (MB), grupo mínimo de percentil, respostas mínimas de pares. |\n| **Exportação em PDF** | Histórico de carreira, Resultados 360, Minha equipe (\"Exportar\") | Servidor de impressão (ORDS/BI Publisher/APEX Office Print) — sem tabela; depende de infraestrutura. |\n| **Comunicado automático** | Histórico (promoção/admissão \"Equipe avisada\") | Trigger/processo que cria `COMUNICADO` vinculado a `MOVIMENTACAO_CARREIRA.comunicado_id`. |\n| **Uso da aplicação** | Configurações (card) | Views sobre `APEX_WORKSPACE_ACTIVITY_LOG` (páginas mais acessadas, pessoas ativas, erros por página). |\n"}, {"arquivo": "08-convencoes-e-pegadinhas.md", "titulo": "08 · Convenções, regras de trabalho e pegadinhas conhecidas", "md": "# 08 · Convenções, regras de trabalho e pegadinhas conhecidas\n\n> Consolida as regras de trabalho e os problemas encontrados nos demais documentos (02–07). Detalhes e números de linha estão nos documentos de origem.\n> Estado: 06/10/2026, branch `DEV`, com mudanças não commitadas.\n\n## 1. Regras para uma IA trabalhando neste repositório\n\n1. **Edite a app em `corlixhub/*.apx` (APEXlang).** Não edite `database/f100.sql` à mão: é um export gerado (12 MB) que serve só para consulta via `grep`.\n2. **Sempre em pt-BR**: textos da UI, comentários, nomes de objetos (`colaborador`, `departamento`, `id_empresa`…), mensagens de commit.\n3. **Nomes de objetos de banco** em `snake_case` minúsculo nos scripts. Prefixos: `pkg_` (packages), `vw_` (views), `trg_<tabela>_aud|log` (triggers), `fn_` (funções), `prc_` (procedures), `id_<entidade>` (PKs/FKs), `dt_` (datas), `fl_` (flags `S/N`), `ds_`/`nm_` quando aparecem.\n4. **Módulos novos** seguem o padrão de `modulos/<nome>/`: scripts SQL numerados + `instalar.sql`, package `pkg_<nome>` com a lógica, `pkg_<nome>_ui` (ou procedure `render_*`) que devolve HTML para uma região *Dynamic Content*, `<nome>.css` e `<nome>.js`, e um `Etapas-<nome>.md` com o passo a passo no Builder. Veja o template em [`06-modulos.md`](./06-modulos.md).\n5. **CSS**: tokens `--cx-*` em `corlix-tema.css`; ajustes e componentes em `custom.css`. **Atualize sempre o `.min.css` junto**, porque não existe script de minificação e os pares são mantidos à mão. Novos arquivos precisam ser registrados em `shared-components/static-files.apx` e, se forem globais, em `application.apx > css.fileUrls`. Prefixo de classes novas: `cx-` (tema), `org-`/`hc-`/`ch-`/`log-` (por módulo). Não há dark mode. A política visual é **sem sombras**. Veja [`04-tema-e-estilos.md`](./04-tema-e-estilos.md).\n6. **Links entre páginas**: as páginas usam `argumentsMustHaveChecksum`, então gere URLs com `apex_page.get_url(...)` ou com o link builder. URLs `f?p=` montadas manualmente com parâmetros quebram.\n7. **Multiempresa**: toda consulta nova a dados de negócio deve filtrar por `id_empresa` da empresa do usuário. Hoje quase nenhuma filtra (ver §3).\n8. **Segurança**: quando criar ou alterar páginas administrativas, defina `authorizationScheme` **na página**, e não apenas na entrada do menu.\n9. **Commits**: Conventional Commits (`feat(escopo): …`). Faça PR para `DEV`. Nunca versione `apex/`, `oracle_oradata/`, `ords_config/`, `.env`.\n10. **Não invente**: o README e o código divergem em vários pontos (ver [`01`](./01-arquitetura-e-ambiente.md) §6). Confie no código e pergunte ao time sobre o que não estiver confirmado (ambiente atual, DDL das tabelas base, `log_pkg`).\n\n## 2. Lacunas estruturais (objetos que faltam no repositório)\n\n| Lacuna | Impacto |\n|---|---|\n| DDL das tabelas base (`COLABORADOR`, `CARGO`, `DEPARTAMENTO`, `EMPRESA`, `COMUNICADO`, `EQUIPE`, `PRESENCA_COLABORADOR`, `CANAL_MENSAGEM`, `APP_LOG`…) | Não é possível recriar o banco só com o repositório. O schema foi inferido do uso (ver `05`). |\n| `log_pkg` (error handler da app: `log_pkg.apex_error_handler`) | Está referenciado em `application.apx`, mas o fonte não está no repositório. |\n| Função `ch_get_canal_direto` (Chat) | Usada na p4, sem fonte. |\n| `docker-compose.yml` e `.env.example` | Deletados no working tree. O CI (`docker compose config`) e `scripts/setup.*` dependem deles. |\n| Supporting objects | Estão vazios: o export da app não instala nada do schema. |\n| Itens e roles exigidos pelos módulos (`G_ID_EMPRESA`, `ID_COLABORADOR`, `ADMIN_RH`, `GESTOR`, `COLABORADOR`, processo `DOWNLOAD_FOTO`, páginas 18–23) | Os módulos de organograma e de histórico de carreira ainda não estão integrados ao app. |\n\n## 3. Pegadinhas por área\n\n### Segurança / multi-tenant\n- **Nenhuma página tem authorization própria**: as 3 authorizations (`administration-rights`, `publicador-de-conteudo`, `somente-diretoria`) só escondem entradas do menu. Pela URL, qualquer usuário logado abre p7 (logs), p14 (cria usuários APEX via `apex_util.create_user`), p15/p16 (empresas) e p17 (emitir comunicado).\n- As queries de comunicados, aniversariantes, chat, organograma, LOVs e equipes **não filtram por `id_empresa`**.\n- Os app processes (4, `BEFORE_HEADER`, sem condição) rodam em todas as páginas, inclusive no login. Eles ligam o usuário ao colaborador por `COLABORADOR.login_apex = :APP_USER`; algumas comparações usam `UPPER` e outras não.\n\n### Páginas\n- **Placeholders** (só breadcrumb): p2 Meu perfil, p3 Organograma, p5 Notificações, p6 Configurações, p11 Comunicados, p12 Colaboradores, p13 Histórico de carreira. A p8 `NOTIFICAÇÕES` está vazia e duplica a p5.\n- **p4 Chat**:\n  - A região de mensagens tem a condição de servidor `P4_CANAL_ID is not null`, então ela não existe no DOM ao carregar e o refresh da DA não funciona.\n  - Em `contatos` aparece `templateOptions: \"[object Object]\"`, um valor corrompido (linha ~330).\n  - A coluna `CAB_DEPT` exige `administration-rights`.\n  - O envio de mensagens ainda não foi implementado.\n- **p17 Comunicado** (modal wizard):\n  - O default é `plsqlExpression: SYSDATE;`, com um `;` a mais.\n  - Não há processo *Close Dialog*.\n  - A lista do wizard aponta para p18/p19, que não existem.\n  - Todos os itens estão com `sequence: 10`.\n- **p16 Cadastro de empresa**:\n  - Os campos de endereço preenchidos pelo ViaCEP ficam desabilitados, e item desabilitado não é submetido.\n  - Os `maxLength` de CEP, telefone e número são curtos demais para valores com máscara.\n  - O logo usa `appTempFiles`.\n- **p1 Home**:\n  - Os links rápidos Holerite/Ponto/Suporte TI levam às páginas 5/6/7.\n  - Os botões Chat/E-mail do gestor têm `href=\"#\"`.\n  - Em `columnCssClasses` há um `.` sobrando.\n  - A coluna `CLASSE_DEPTO` não é usada.\n- **p0 Global**: a busca global do cabeçalho não tem comportamento. Os links usam o caminho fixo `r/corlixhub/...`.\n\n### Arquivos e tema\n- As fotos são montadas como `#APP_FILES#fotos/<foto_url>` (app process e Home), mas a pasta real é `static-files/Fotos Colaboradores/` (`nome_sobrenome.jpg`, ~291 fotos fictícias). O fallback é `default-user.jpeg`.\n- `custom.css` tem regras globais (`.a-CardView-*` com sombra e raio 14px, `.ui-dialog-titlebar`) que contrariam a política \"sem sombra\" do tema.\n- `organograma.css` e `historico-carreira.css` ainda não estão em `static-files/`.\n- Static IDs e aliases com acento (`publicador-de-conteúdo`, `histórico-de-carreira`, `NOTIFICAÇÕES`) são frágeis em URLs e scripts.\n\n### Módulos\n- O guia do organograma usa a página 10 (`P10_ID_FOCO`), mas a página real é a **3**.\n- `c_pagina_perfil = 20` do organograma conflita com o Dashboard RH (página 20) planejado pelo histórico de carreira.\n- `vw_org_colaborador` não filtra por empresa, e o drawer de detalhes não verifica permissão.\n- `G_ID_EMPRESA` só é preenchido depois de um novo login. Sem esse item, toda chamada a `pkg_historico_carreira` dentro de uma sessão APEX falha com `-20012`.\n- A spec de `pkg_historico_carreira` diz que a p14 chama `registrar_admissao_automatica`, mas a p14 não faz essa chamada.\n- `COMUNICADO.TITULO` aceita até 200 caracteres no formulário (p17), mas o package corta em 100.\n- O README do módulo de carreira fala em \"nove códigos padrão\" de movimentação, mas o seed cria 11.\n\n### Configuração\n- O idioma primário da app é `en`, com máscaras de data `DS`. Para pt-BR, formate explicitamente com `to_char(..., 'dd/mm/yyyy')`. A LOV `BOOLEAN` mostra \"Yes/No\".\n- `deployments/default.json` está com `debugging: true`.\n- O último commit (`feature: …`) não segue o padrão do hook `commit-msg`.\n\n## 4. Checklist rápido antes de entregar uma mudança\n- [ ] Editei o `.apx` correto (e o `.min.css` junto com o `.css`, quando aplicável)?\n- [ ] Os novos estáticos estão registrados em `static-files.apx`?\n- [ ] As queries filtram por empresa? A página tem authorization?\n- [ ] Os links foram gerados com checksum (`apex_page.get_url`)?\n- [ ] Os textos estão em pt-BR e as datas formatadas explicitamente?\n- [ ] O SQL novo está num script numerado e idempotente (`create table if not exists`, `create or replace`) e foi adicionado ao `instalar.sql` do módulo?\n- [ ] A documentação em `docs/ai-context/` foi atualizada se a mudança altera páginas, schema, tema ou módulos?\n"}];
const menu = document.getElementById('menu'), main = document.getElementById('conteudo'), q = document.getElementById('q');
const slug = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
try { mermaid.initialize({startOnLoad:false, theme: matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'default'}); } catch(e) {}

function render(i, ancora){
  const d = DOCS[i];
  let md = d.md.replace(/\]\(\.\/([0-9]{2}-[^)#]+\.md|README\.md)(#[^)]*)?\)/g, (m, f, h) => '](#' + f + (h || '') + ')');
  main.innerHTML = marked.parse(md);
  main.querySelectorAll('h2,h3').forEach(h => h.id = slug(h.textContent));
  main.querySelectorAll('pre code.language-mermaid').forEach(c => { const div = document.createElement('div'); div.className='mermaid'; div.textContent=c.textContent; c.parentElement.replaceWith(div); });
  try { mermaid.run({querySelector:'.mermaid'}); } catch(e) {}
  if (q.value.trim()) destacar(q.value.trim());
  montarMenu(i);
  if (ancora) { const el = document.getElementById(ancora); if (el) el.scrollIntoView(); } else scrollTo(0,0);
}
function montarMenu(atual){
  const termo = q.value.trim().toLowerCase();
  menu.innerHTML = '';
  DOCS.forEach((d, i) => {
    if (termo && !d.md.toLowerCase().includes(termo)) return;
    const a = document.createElement('a'); a.href = '#' + d.arquivo; a.textContent = d.titulo; if (i === atual) a.className = 'on'; menu.appendChild(a);
    if (i === atual) d.md.split('\n').filter(l => l.startsWith('## ')).forEach(l => {
      const t = l.slice(3).replace(/`/g,''); const s = document.createElement('a'); s.className='sub'; s.href = '#' + d.arquivo + '#' + slug(t); s.textContent = t; menu.appendChild(s);
    });
  });
}
function destacar(termo){
  const w = document.createTreeWalker(main, NodeFilter.SHOW_TEXT); const nos = []; let n;
  while ((n = w.nextNode())) if (n.nodeValue.toLowerCase().includes(termo.toLowerCase())) nos.push(n);
  nos.forEach(n => { const re = new RegExp('(' + termo.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')','gi'); const span = document.createElement('span'); span.innerHTML = n.nodeValue.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])).replace(re,'<mark>$1</mark>'); n.replaceWith(span); });
}
function rota(){
  const [arq, ancora] = decodeURIComponent(location.hash.slice(1)).split('#');
  const i = Math.max(0, DOCS.findIndex(d => d.arquivo === arq));
  render(i, ancora);
}
q.addEventListener('input', rota);
addEventListener('hashchange', rota);
rota();
</script>
