const DOCS = [{"arquivo": "README.md", "titulo": "Corlix Hub · Contexto para IAs", "md": "# Corlix Hub · Contexto para IAs\n\n> **Ponto de entrada** para qualquer IA ou agente que for trabalhar neste repositório. Leia este arquivo inteiro e depois abra só os documentos relevantes para a tarefa.\n> Gerado em 06/10/2026 a partir da inspeção do código (branch `DEV`, HEAD `bac2d69` + mudanças não commitadas). Versão visual: [`index.html`](./index.html).\n\n## Resumo em 30 segundos\n\n- **Produto:** intranet corporativa SaaS para PMEs. Reúne colaboradores, organograma, histórico de carreira, comunicados, chat, equipes e cadastro multiempresa. Projeto FIAP Enterprise Challenge 2026.\n- **Stack:** Oracle APEX 26.1 (Universal Theme, visual Redwood Light) sobre Oracle Database 23ai e ORDS 25.4. Toda a lógica está em SQL/PL/SQL e nas definições declarativas do APEX. Não há Node/Java/Python.\n- **App:** ID `100`, alias `CORLIXHUB`, workspace/schema `WKSP_CORLIXHUB`, autenticação por contas APEX, idioma da UI pt-BR (idioma primário técnico `en`).\n- **Fonte da app:** `corlixhub/` em formato **APEXlang** (`.apx`). `database/f100.sql` é o mesmo app num export SQL de 12 MB: use só para consultar, nunca edite.\n- **Banco:** só o módulo de histórico de carreira tem DDL no repo (`modulos/historico-carreira/`). As tabelas base (`COLABORADOR`, `CARGO`, `DEPARTAMENTO`, `EMPRESA`, `COMUNICADO`, `EQUIPE`…) **não têm DDL versionado**; o schema delas foi inferido do uso.\n- **Em andamento:** redesign visual (tokens `--cx-*` em `corlix-tema.css`), módulos de Organograma e Histórico de carreira (prontos em `modulos/`, ainda **não integrados** às páginas 3 e 13) e ~28 telas-alvo em `figma/`.\n\n## Documentos\n\n| # | Documento | Quando ler |\n|---|---|---|\n| 01 | [Arquitetura e ambiente](./01-arquitetura-e-ambiente.md) | Stack, mapa de pastas, Docker, CI, branches/commits, divergências README × código |\n| 02 | [Páginas](./02-paginas.md) | Sintaxe APEXlang + cada página (regiões, itens, processos, DAs, SQL), mapa de navegação |\n| 03 | [Componentes compartilhados](./03-componentes-compartilhados.md) | `application.apx`, roles/authorizations, app items/processes, menu, breadcrumbs, LOVs, templates do tema, static files |\n| 04 | [Tema e estilos](./04-tema-e-estilos.md) | Tokens `--cx-*`, mapeamento Universal Theme, catálogo de classes CSS, como aplicar o tema numa página |\n| 05 | [Banco de dados](./05-banco-de-dados.md) | Diagrama ER, tabelas (DDL e inferidas), views, triggers, packages, códigos de erro, testes |\n| 06 | [Módulos](./06-modulos.md) | Organograma e Histórico de carreira: arquitetura, integração no APEX, API JS, template de novo módulo |\n| 07 | [Design (Figma)](./07-design-figma.md) | Descrição detalhada de cada tela-alvo e mapeamento para componentes APEX; features sem backend |\n| 08 | [Convenções e pegadinhas](./08-convencoes-e-pegadinhas.md) | **Leia antes de editar qualquer coisa.** Regras de trabalho, lacunas, bugs conhecidos, checklist |\n\n### Guia por tipo de tarefa\n- **Mexer numa página existente:** 08 → 02 (seção da página) → 03 (componentes que ela usa) → 04 (classes CSS).\n- **Criar uma página ou tela do Figma:** 07 (tela) → 02 §1 (sintaxe) → 04 §8 (aplicar tema) → 08.\n- **Mexer no banco ou criar tabela:** 05 → 06 §4 (padrão de módulo) → 08.\n- **Integrar organograma ou histórico de carreira:** 06 → 05 → 02 (páginas 3/13).\n- **Ambiente, deploy ou CI:** 01.\n\n## Páginas (visão rápida)\n\n| Nº | Página | Status |\n|---|---|---|\n| 0 | Global Page (header: busca, sino, config, usuário) | Implementada |\n| 1 | Home (dashboard) | Implementada |\n| 2 | Meu Perfil | Placeholder |\n| 3 | Organograma | Placeholder; o módulo existe em `modulos/organograma` |\n| 4 | Chat | Parcial (leitura, sem envio) |\n| 5 / 8 | Notificações (duplicadas) | Placeholder / vazia |\n| 6 | Configurações | Placeholder |\n| 7 | Monitor de Logs | Implementada (sem authorization!) |\n| 11 | Comunicados Oficiais | Placeholder |\n| 12 | Colaboradores | Placeholder |\n| 13 | Histórico de carreira | Placeholder; o módulo existe em `modulos/historico-carreira` |\n| 14 | Cadastro de Usuários (cria usuário APEX) | Implementada |\n| 15 / 16 | Empresas (lista / modal de cadastro com ViaCEP) | Implementada |\n| 17 | Emitir Comunicado (modal wizard) | Implementada, com bugs |\n| 26 / 27 | Central de Equipes / Nova Equipe (modal) | Implementada |\n| 9999 | Login | Implementada |\n\n## Regras de ouro (resumo do 08)\n1. Edite `corlixhub/**/*.apx`; nunca edite `database/f100.sql`.\n2. Use pt-BR em tudo e Conventional Commits; abra PRs para `DEV`.\n3. Toda query de negócio deve filtrar por `id_empresa`, e toda página administrativa precisa de `authorizationScheme` na própria página.\n4. Gere links com checksum (`apex_page.get_url`).\n5. Ao alterar um `.css`, altere também o `.min.css` e registre arquivos novos em `static-files.apx`.\n6. Se o README raiz divergir do código, confie no código. O que não estiver confirmado, pergunte ao time (ex.: o ambiente atual, já que `docker-compose.yml` foi apagado, e o fonte de `log_pkg`).\n7. Ao mudar páginas, schema, tema ou módulos, **atualize o documento correspondente nesta pasta**.\n"}, {"arquivo": "01-arquitetura-e-ambiente.md", "titulo": "01 · Arquitetura, ambiente e fluxo de trabalho", "md": "# 01 · Arquitetura, ambiente e fluxo de trabalho\n\n> Parte do pacote de contexto para IAs (`docs/ai-context/`). Comece pelo [`README.md`](./README.md) desta pasta.\n> Gerado a partir da inspeção dos arquivos em 06/10/2026 (branch `DEV`, HEAD `bac2d69`).\n\n## 1. O que é o Corlix Hub\n\n- Intranet corporativa SaaS para **PMEs**: gestão de colaboradores, organograma, histórico de carreira, comunicação interna (comunicados, chat, notificações), equipes e cadastro multiempresa.\n- Projeto acadêmico do **Enterprise Challenge (StartupOne) — FIAP, turma 4ESOA, 2026**. Tech lead: Sarah Ribeiro da Silva.\n- Slogan: *\"Core logic, smart solutions.\"*\n- Idioma de toda a UI, código, comentários e documentação: **português do Brasil**.\n\n## 2. Stack\n\n| Camada | Tecnologia | Observação |\n|---|---|---|\n| App / UI | **Oracle APEX 26.1** (release 26.1.5), Universal Theme (visual Redwood Light) | App ID `100`, alias `CORLIXHUB`, nome \"Corlix Hub\" |\n| Banco | **Oracle Database 23ai Free** (`23.26.1.0`) | Schema/workspace `WKSP_CORLIXHUB`, PDB `FREEPDB1` |\n| HTTP | **ORDS 25.4.0** | Serve o APEX |\n| Dev local | Docker Compose (`db` + `ords`) | ⚠️ ver §5 — `docker-compose.yml` está deletado no working tree |\n| Lógica | SQL + PL/SQL (packages, views, triggers) | Nenhum backend fora do banco |\n| Front custom | CSS (`corlix-tema.css`, `custom.css`, CSS de módulos) + JS vanilla/jQuery do APEX (`apex.*`) | Sem bundler, sem `package.json` |\n\nNão existe Node, Java, Python etc. no projeto. Toda regra de negócio vive no banco (PL/SQL) ou nas definições declarativas do APEX.\n\n## 3. Mapa do repositório\n\n```\nCorlixHub/\n├── README.md                  # README humano (⚠️ parcialmente desatualizado — ver §6)\n├── CLAUDE.md / AGENTS.md      # Ponteiros para esta documentação (para agentes de IA)\n├── docs/ai-context/           # ESTA documentação para IAs\n├── corlixhub/                 # ★ CÓDIGO-FONTE DA APP APEX em formato APEXlang (.apx)\n│   ├── application.apx        #   definição global da app (auth, CSS globais, menu, error handler)\n│   ├── page-groups.apx        #   grupo \"Administration\"\n│   ├── .apex/apexlang.json    #   versão do formato (mmdVersion 26.1.0+3102)\n│   ├── deployments/default.json  # app id 100, debugging true\n│   ├── supporting-objects/    #   supporting objects (incluídos no export, vazios)\n│   ├── pages/pNNNNN-<nome>.apx   # 1 arquivo por página (19 páginas)\n│   └── shared-components/     #   roles, authorizations, app items/processes, lists, LOVs, breadcrumbs,\n│       ├── static-files.apx   #   registro dos arquivos estáticos (#APP_FILES#)\n│       ├── static-files/      #   CSS do tema, ícones PWA, default-user.jpeg, \"Fotos Colaboradores/\" (~291 fotos fictícias)\n│       └── themes/universal-theme/  # templates customizados (page/region/report/button)\n├── database/\n│   └── f100.sql               # Export SQL clássico (single-file) da app 100 — 12 MB, ~63k linhas.\n│                              #   É a MESMA app de corlixhub/, em outro formato. NÃO contém DDL das tabelas.\n├── modulos/                   # Módulos de feature desenvolvidos fora do Builder (SQL/CSS/JS + guias \"Etapas-*.md\")\n│   ├── organograma/           #   vw_org_colaborador, pkg_organograma, organograma.css/js, PNGs de redesign\n│   ├── historico-carreira/    #   (untracked) DDL completo + packages + views + triggers + testes + CSS/JS\n│   └── tema/                  #   (untracked) guia de aplicação do tema visual nas páginas\n├── figma/                     # (untracked) ~28 PNGs com o design-alvo das telas\n├── scripts/\n│   ├── setup.sh / setup.ps1   # setup do ambiente Docker (macOS/Linux e Windows)\n│   ├── git-hooks/commit-msg   # valida Conventional Commits\n│   └── apex-limpar-sql-scripts.sql  # apaga SQL Scripts do workspace (dry-run por padrão)\n└── .github/workflows/ci.yml   # CI: valida docker-compose, gitleaks, bloqueia pastas proibidas\n```\n\n## 4. Dois formatos da mesma aplicação\n\n| | `corlixhub/` (APEXlang) | `database/f100.sql` |\n|---|---|---|\n| Formato | Declarativo, legível, 1 arquivo por página/componente | `wwv_flow_imp*` PL/SQL gerado, single file |\n| Uso por IA | **Leia e edite aqui.** Diffs pequenos, revisáveis | Só para grep/consulta; não editar à mão (Oracle não suporta) |\n| Arquivos estáticos | Arquivos reais em `static-files/` | Embutidos em hex (~301 blocos `shared_components/files`) |\n| Instalação | Import/sync via ferramentas APEXlang/SQLcl do APEX 26.1 | `@database/f100.sql` no SQLcl conectado como `WKSP_CORLIXHUB` |\n\nAo alterar a app no Builder, reexporte para **ambos** (ou combine com o time qual é a fonte de verdade — hoje, na prática, `corlixhub/` é a fonte principal e `f100.sql` é um snapshot). O export de `f100.sql` mais recente é de 04/10/2026 01:10, exportado por `SARAHSILVA`.\n\nContagens do export (cabeçalho de `f100.sql`): 19 páginas, 54 itens, 48 regiões, 15 processos, 17 botões, 8 dynamic actions, 1 validação; shared: 5 app items, 4 app processes, 2 lists, 1 breadcrumb (12 entradas), 1 authentication, 3 authorizations, 3 ACL roles, 4 LOVs, 1 tema com templates customizados (1 page, 1 region, 1 button, 2 report).\n\n## 5. Ambiente de desenvolvimento\n\n### 5.1 Docker (histórico — arquivos deletados no working tree)\n\nNo commit `HEAD` existiam `docker-compose.yml` e `.env.example`; **ambos aparecem como deletados (não commitado)** no `git status` atual. Conteúdo do `HEAD`:\n\n```yaml\nservices:\n  db:\n    image: container-registry.oracle.com/database/free:23.26.1.0\n    hostname: database\n    ports: [\"${DB_HOST_PORT:-1522}:1521\"]\n    environment: [ORACLE_PWD=${ORACLE_PWD:-pwd}, DBHOST=database]\n    volumes: [./oracle_oradata/:/opt/oracle/oradata, ./apex/:/opt/oracle/apex]\n  ords:\n    image: container-registry.oracle.com/database/ords:25.4.0\n    ports: [\"${ORDS_HOST_PORT:-8081}:8080\"]\n    environment: [DBHOST=database, DBPORT=1521, DBSERVICENAME=FREEPDB1, ORACLE_PWD=..., APEX_PWD=...]\n    volumes: [./ords_config/:/etc/ords/config, ./apex/:/opt/oracle/apex]\n    depends_on: { db: { condition: service_healthy } }\n```\n\nVariáveis: `ORACLE_PWD`, `APEX_PWD`, `DB_HOST_PORT=1522`, `ORDS_HOST_PORT=8081`.\nURLs locais: Builder `http://localhost:8081/ords`; app `http://localhost:8081/ords/r/wksp_corlixhub/corlixhub` (não confirmado).\n\n⚠️ **Consequências se essa deleção for commitada:** o job `validate` do CI roda `docker compose config` e vai falhar; `scripts/setup.*` também passam a não funcionar. Pergunte ao time antes de assumir qual é o ambiente atual (possivelmente migraram para uma instância APEX hospedada/OCI ou outra forma de rodar).\n\n### 5.2 Pastas que nunca vão para o Git\n`apex/` (distribuição Oracle ~1,1 GB), `META-INF/`, `oracle_oradata/` (datafiles), `ords_config/` (contém wallet e chave TLS), `.env*` (exceto `.env.example`), `*.log`, `.DS_Store`. O CI bloqueia `apex/`, `oracle_oradata/`, `ords_config/`, `META-INF/`.\n\n### 5.3 Instalando o banco de uma feature\nOs objetos de banco \"core\" (`COLABORADOR`, `CARGO`, `DEPARTAMENTO`, `EMPRESA`, `COMUNICADO`…) **não têm DDL no repositório** (o README cita `database/ddl/` e `database/seed/`, que não existem). Os módulos trazem seus próprios scripts:\n- Histórico de carreira: `modulos/historico-carreira/instalar.sql` (roda `00_…` a `07_…` em ordem).\n- Organograma: `modulos/organograma/organograma.sql`.\nDetalhes em [`05-banco-de-dados.md`](./05-banco-de-dados.md) e [`06-modulos.md`](./06-modulos.md).\n\n## 6. Divergências README × realidade (importante para IAs)\n\n| README diz | Realidade no repo |\n|---|---|\n| App exportada em `f100/application/pages/*.sql` + `f100/install.sql` | App está em `corlixhub/` (APEXlang `.apx`) e `database/f100.sql` (single file) |\n| `database/ddl/schema_corlixhub.sql` e `database/seed/seed_corlixhub.sql` | Não existem |\n| \"Não há packages PL/SQL próprios\" | Existem `pkg_historico_carreira`, `pkg_historico_carreira_ui`, `pkg_organograma`; a app usa `log_pkg.apex_error_handler` |\n| \"Não há testes\" | Existe `modulos/historico-carreira/07_testes.sql` |\n| `docs/` não existe | Agora existe `docs/ai-context/` |\n| Repo sem commits/remote | Remote `https://github.com/CorlixStartup/CorlixHub.git`; branches remotas `DEV` (HEAD), `UAT`, `PROD`, `main`, `feature/cadastro-empresas`; PR #1 mergeado |\n| Seis entidades: Empresa, Colaborador, Cargo, Departamento, Movimentacao_Carreira, Comunicado | `Movimentacao_Carreira` virou `HISTORICO_CARREIRA` + `TIPO_MOVIMENTACAO`; há também equipes, chat, logs, presença etc. |\n\nQuando o README e o código discordarem, **confie no código** e sinalize a divergência.\n\n## 7. Git, branches e commits\n\n- Branches permanentes: `DEV` (integração, padrão para PRs) → `UAT` (homologação) → `PROD`. Auxiliares: `feature/*`, `bugfix/*` (de `DEV`), `hotfix/*` (de `PROD`, depois replicado para UAT e DEV), `release/*` opcional.\n- Nunca commit direto em `DEV`/`UAT`/`PROD`; sempre PR.\n- **Conventional Commits** validado por `scripts/git-hooks/commit-msg` (ativar com `git config core.hooksPath scripts/git-hooks`). Regex:\n  `^(feat|fix|hotfix|refactor|test|docs|chore|build|ci|perf)(\\([a-z0-9_-]+\\))?!?: .{1,100}$`\n  Ex.: `feat(organograma): adiciona drawer de detalhes da pessoa`. (Obs.: o último commit `feature: …` não segue o padrão — o hook provavelmente não estava ativo.)\n- `.gitattributes`: LF para tudo (`.sql`, `.sh`, `.md`, `.yml`), CRLF para `.ps1/.bat/.cmd`; imagens binárias.\n\n## 8. CI (`.github/workflows/ci.yml`)\nRoda em PR/push para `DEV`, `UAT`, `PROD`:\n1. `validate` — `docker compose config` (precisa do `docker-compose.yml`).\n2. `secret-scan` — gitleaks 8.28.0 (CLI OSS) sobre todo o histórico.\n3. `forbidden-paths` — falha se `apex/`, `oracle_oradata/`, `ords_config/` ou `META-INF/` existirem.\nNão há deploy automatizado nem testes automatizados no CI.\n\n## 9. Estado do working tree no momento desta documentação\nModificados (não commitados): `application.apx`, páginas 1, 4, 14, 16, 27, `static-files.apx`, `custom.css/.min.css`, `database/f100.sql`, arquivos de `modulos/organograma/`.\nNovos (untracked): `corlix-tema.css/.min.css`, `figma/`, `modulos/historico-carreira/`, `modulos/tema/`, PNGs de redesign do organograma, `scripts/apex-limpar-sql-scripts.sql`.\nDeletados: `.env.example`, `docker-compose.yml`.\nOu seja: há um trabalho grande de **redesign visual (tema Corlix)** + **módulo de histórico de carreira** em andamento.\n"}, {"arquivo": "02-paginas.md", "titulo": "02 — Páginas da aplicação (APEX app 100 / CORLIXHUB)", "md": "# 02 — Páginas da aplicação (APEX app 100 / CORLIXHUB)\n\n> Documento de contexto para IA. Fonte: leitura integral de `corlixhub/pages/*.apx` (19 arquivos) + shared components citados (`corlixhub/shared-components/lists.apx`, `breadcrumbs.apx`, `authorizations.apx`, `app-processes.apx`, `app-items.apx`, `lovs.apx`, templates em `corlixhub/shared-components/themes/universal-theme/`). Estado: branch `DEV`, commit `bac2d69` + mudanças não commitadas (ver §5).\n> `database/f100.sql` (export clássico, 12 MB) é equivalente; **não** leia inteiro, use `grep`.\n\n---\n\n## 1. Sintaxe APEXlang (`.apx`, mmdVersion 26.1.0) — o que é preciso para editar à mão\n\n### 1.1 Estrutura geral\n- Um arquivo por página: `corlixhub/pages/pNNNNN-<slug>.apx` (número com 5 dígitos; slug pode conter acentos, ex.: `p00008-notificações.apx`, `p00013-histórico-de-carreira.apx`).\n- Blocos de **componente** usam `tipo identificador ( ... )` (parênteses). Blocos de **propriedades agrupadas** usam `grupo { ... }` (chaves). Ex.: `region novo ( ... layout { sequence: 10 } ... )`.\n- Raiz: `page <número> ( name: ... alias: ... title: ... appearance {...} navigation {...} security {...} javaScript {...} css {...} <componentes> )`.\n- Componentes filhos de página: `region`, `pageItem`, `button`, `process`, `dynamicAction` (com `action` filhos), `validation`, `branch` (sem identificador: `branch ( ... )`).\n- Componentes aninhados: `region` de relatório contém `column`; IR contém `savedReport primary ( displayColumn X (...) sort (...) )`; `process type: invokeApi` contém `parameter`; botão com `action: triggerAction` contém `triggerAction <id> (...)`.\n- Valores: escalares sem aspas (`label: Salvar Usuario`), listas com colchetes e um item por linha (`templateOptions: [ #DEFAULT# t-Region--noUI ]`), alvos de link como objeto `target: { page: 16 items: { P16_ID_EMPRESA: \\#ID_EMPRESA#\\ } action: resetPagination }` (note o escape `\\#...#\\` para substituições `#COL#` dentro de valores de item).\n- Código multilinha em blocos cercados com linguagem: ` ```sql `, ` ```plsql `, ` ```html `, ` ```css `, ` ```javascript-browser `. A indentação do bloco é a do campo; o conteúdo é indentado relativo a ele.\n- Comentários `//` aparecem só por acidente (ver bug histórico da Home em §5).\n\n### 1.2 Referências `@`\n- `@identificador` = componente local (região/item/botão da mesma página ou shared component do app). Ex.: `parentRegion: @container-conteudo-principal`, `region: @novo`, `button: @B_VER_TODOS`, `formRegion: @step-1`, `breadcrumb: @breadcrumb`, `lov: @boolean`, `authorizationScheme: @administration-rights`.\n- `@/nome` = template/tema padrão do Universal Theme. Ex.: `pageTemplate: @/standard`, `@/login`, `@/modal-dialog`, `@/wizard-modal-dialog`, `template: @/blank-with-attributes`, `@/title-bar`, `@/interactive-report`, `@/cards-container`, `@/inline-dialog`, `@/tabs-container`, `@/buttons-container`, `@/required-floating`, `@/optional-floating`, `@/hidden`, `buttonTemplate: @/text`, `@/text-with-icon`.\n- `@nome` sem barra para templates **customizados** do app: `@corlix-standard-page` (page template, `themes/universal-theme/page-templates/corlix-standard-page.apx`), `@cards-container-image-first` (region template), `@chat-contatos` e `@chat-mensagens` (classic report templates em `themes/universal-theme/classic-report-templates/`).\n- O identificador do componente (ex.: `region new`, `region novo`, `region step-1`) é independente do `name:` exibido no Builder. Itens usam o próprio nome (`pageItem P14_CARGO`).\n\n### 1.3 Layout / slots\n- `layout { sequence: N slot: <slot> parentRegion: @x region: @x columnSpan: 8 startNewRow: false newColumn: false columnCssClasses: ... alignment: left }`.\n- Slots de página vistos: `body`, `breadcrumbBar`, `contentBody`, `dialogsDrawersAndPopups`, `dialogFooter`, `wizardBody`, `wizardButtons`, `afterLogo`, `afterNavigationBar` (Global Page).\n- Slots dentro de região: `regionBody`, `subRegions`, `tabs` (filhos de tabs-container), `next`, `close`, `delete`, `create`, `edit`, `rightOfInteractiveReportSearchBar` (botões).\n- Itens apontam para região via `layout { region: @r slot: regionBody }`; colunas de form via `source { formRegion: @r column: COL dataType: ... primaryKey: true queryOnly: true }`.\n\n### 1.4 Aparência\n- `appearance { template: @/... templateOptions: [ #DEFAULT# classe1 classe2 ] cssClasses: ... icon: fa-xxx hot: true }`. `#DEFAULT#` = opções padrão do template; demais são classes do UT (`t-Region--noUI`, `t-Region--removeHeader js-removeLandmark`, `t-Button--danger`, `t-Button--iconRight`, ...). Nota: `t-Region--removeHeader js-removeLandmark` ocupa uma única linha (é uma opção composta).\n- `componentAppearance { ... }` = template do componente interno (cards layout, report template, breadcrumb template).\n- `#APP_FILES#` = prefixo de arquivos estáticos do app (`shared-components/static-files/`), ex.: `#APP_FILES#icons/app-icon-512.png`, `#APP_FILES#default-user.jpeg`. `#MIN#` alterna `.min` (usado em `application.apx`: `#APP_FILES#corlix-tema#MIN#.css`).\n- Substituições: `&ITEM.` (session state, ex.: `&G_NOME_USUARIO.`, `&APP_ALIAS.`, `&SESSION.`, `&APP_ID.`), `&COL.` em HTML expressions de Cards, `#COL#` em templates de relatório/HTML expression de colunas IR, `&APP_TEXT$DELETE_MSG!RAW.` (texto de tradução com escape RAW).\n\n### 1.5 Mini exemplo real (Home, botão + DA)\n```\n    button B_VER_TODOS (\n        buttonName: B_VER_TODOS\n        label: Ver todos\n        layout {\n            sequence: 10\n            region: @lista-aniversariantes\n            slot: next\n        }\n        appearance {\n            buttonTemplate: @/text-with-icon\n            templateOptions: [\n                #DEFAULT#\n                t-Button--noUI\n                t-Button--iconRight\n            ]\n            icon: fa-arrow-right\n        }\n        behavior {\n            action: definedByDynamicAction\n        }\n    )\n\n    dynamicAction abrir-popup-aniversariantes (\n        name: Abrir Popup Aniversariantes\n        execution { sequence: 20 }\n        when {\n            event: click\n            selectionType: button\n            button: @B_VER_TODOS\n        }\n        action native-javascript-code (\n            action: openRegion\n            affectedElements {\n                selectionType: region\n                region: @POPUP_ANIVERSARIANTES\n            }\n            execution { sequence: 10 fireOnInit: false }\n        )\n    )\n```\n(No arquivo real cada propriedade fica em sua própria linha; condensei `execution` aqui.)\n\n### 1.6 Outros padrões\n- Processos: `process <id> ( name: type: executeCode|formInitialization|formAutoRowProcessing|closeDialog|clearSessionState|invokeApi  source { plsqlCode: ```plsql``` }  formRegion: @r  execution { sequence: N point: beforeHeader|afterSubmit }  serverSideCondition { type: requestIsContainedInValue value: CREATE,SAVE,DELETE }  successMessage {...}  advanced { executionMappingIdentifier: <número> } )`. O `executionMappingIdentifier` é gerado pelo APEX — preservar ao editar; ao criar um novo, omitir (provavelmente gerado na importação — não verificado).\n- DAs: `when { event: click|ready|keyup|apexafterclosedialog  selectionType: button|items|region|jQuerySelector ... }`, `clientSideCondition { type: itemIsNotNull item: X }`, ações com `execution { fireWhenEventResultIs: false }` = ramo \"falso\". Sem `event:` explícito em DA de itens = evento padrão `change`.\n- Ação servidor: `action: executeServerSideCode settings { plsqlCode: ... itemsToSubmit: X itemsToReturn: Y }`.\n- Validação: `validation <id> ( validation { type: functionBodyReturningBoolean plsqlFunctionBody: ... alwaysExecute: true } error { errorMessage: ... associatedItem: @ITEM } )`.\n- Itens: `type: textField|password|checkbox|switch|selectOne|selectList|popupLov|datePicker|textarea|hidden|imageUpload`; `lov { type: sqlQuery|sharedComponent sqlQuery: ... lov: @x }`; `cascadingLov { parentItems: ... itemsToSubmit: ... }`; `validation { valueRequired: true maxLength: N }`; `default { type: expression|sqlQuerySingleValue ... }`; `sessionState { dataType: boolean|clob storage: request|session }`.\n- Segurança comum a todas as páginas: `security { pageAccessProtection: argumentsMustHaveChecksum formAutoComplete: false }`. **Nenhuma página declara `authorizationScheme` próprio** (ver §6).\n\n---\n\n## 2. Tabela-resumo\n\n| Nº | Nome | Alias | Arquivo | Template | Modo | Autorização (página / menu) | Status |\n|---|---|---|---|---|---|---|---|\n| 0 | Global Page | — | p00000-global-page.apx | — | — | — | Implementada (header: busca + ações/usuário) |\n| 1 | Home | HOME | p00001-home.apx | @/standard | normal | nenhuma / nenhuma | Implementada (dashboard) |\n| 2 | Meu Perfil | MEU-PERFIL | p00002-meu-perfil.apx | @/standard | normal | nenhuma / nenhuma | Placeholder (só breadcrumb) |\n| 3 | Organograma | ORGANOGRAMA | p00003-organograma.apx | @/standard | normal | nenhuma / nenhuma | Placeholder (módulo em `modulos/organograma/`, não integrado) |\n| 4 | Chat | CHAT | p00004-chat.apx | @corlix-standard-page | normal | nenhuma / nenhuma (coluna CAB_DEPT exige @administration-rights) | Implementada parcialmente (leitura; sem envio) |\n| 5 | Notificações | NOTIFICACOES | p00005-notificacoes.apx | @corlix-standard-page | normal | nenhuma | Placeholder (breadcrumb) |\n| 6 | Configurações | CONFIGURACOES | p00006-configuracoes.apx | @corlix-standard-page | normal | nenhuma | Placeholder (breadcrumb) |\n| 7 | Monitor de Logs | MONITOR_LOGS | p00007-monitor-logs.apx | @corlix-standard-page | normal | nenhuma / nenhuma (!) | Implementada (3 IRs em abas) |\n| 8 | Notificações | NOTIFICAÇÕES | p00008-notificações.apx | @/standard | normal | nenhuma | Vazia (nem breadcrumb) — duplicata da 5 |\n| 11 | Comunicados Oficiais | COMUNICADOS-OFICIAIS | p00011-comunicados-oficiais.apx | @/standard | normal | nenhuma / nenhuma | Placeholder (breadcrumb) |\n| 12 | Colaboradores | COLABORADORES | p00012-colaboradores.apx | @/standard | normal | nenhuma / nenhuma | Placeholder (breadcrumb) |\n| 13 | Histórico de carreira | HISTÓRICO-DE-CARREIRA | p00013-histórico-de-carreira.apx | @/standard | normal | nenhuma / nenhuma | Placeholder (módulo em `modulos/historico-carreira/`, não integrado) |\n| 14 | Cadastro de Usuários | CADASTROS-DE-USUARIOS | p00014-cadastros-de-usuarios.apx | @/standard | normal | nenhuma / menu: @somente-diretoria | Implementada (form COLABORADOR + cria usuário APEX) |\n| 15 | Empresas Cadastradas | EMPRESAS-CADASTRADAS | p00015-empresas-cadastradas.apx | @/standard | normal | nenhuma / menu: @administration-rights | Implementada (IR EMPRESA) |\n| 16 | Cadastro de Empresas | CADASTRO-DE-EMPRESAS | p00016-cadastro-de-empresas.apx | @/modal-dialog | modal | nenhuma / (isCurrent do item 15) | Implementada (form EMPRESA + ViaCEP) |\n| 17 | Emitir Comunicado | COMUNICADO | p00017-comunicado.apx | @/wizard-modal-dialog | modal (h=600) | nenhuma / menu: @publicador-de-conteudo | Implementada (form COMUNICADO) |\n| 26 | Central de Equipes | CENTRAL-DE-EQUIPES | p00026-central-de-equipes.apx | @corlix-standard-page | normal | nenhuma / nenhuma | Implementada (classic report EQUIPE) |\n| 27 | Nova Equipe | NOVA-EQUIPE | p00027-nova-equipe.apx | @/modal-dialog | modal | nenhuma | Implementada (form EQUIPE) |\n| 9999 | Login Page | LOGIN | p09999-login.apx | @/login | normal, `authentication: public` | pública | Implementada (login padrão APEX) |\n\nNotas da tabela:\n- Grupo de páginas: existe só `pageGroup administration` (`corlixhub/page-groups.apx`), **nenhuma página o referencia**.\n- Autorizações existentes (`shared-components/authorizations.apx`, todas `isInRoleOrGroup`, avaliação por sessão): `administration-rights` (\"Equipe do Corlix Hub\"), `publicador-de-conteudo` (\"Publicador de Conteúdo\"), `somente-diretoria` (\"Diretoria\"). Só são usadas em entradas do menu e na coluna CAB_DEPT do Chat.\n- Páginas inexistentes mas referenciadas: 18 e 19 (lista `emitir-comunicado`, steps 2 e 3 do wizard).\n- Menu lateral (`list navigation-menu`): Home(1) seq10 → Meu Perfil(2) 20 → Organograma(3) 30 → Comunicados(11) 40 → Colaboradores(12) 50 → Histórico de carreira(13) 60 → Cadastro de Usuários(14) 70 → Emitir Comunicado(17) 80 (filho de Home) → Empresas Cadastradas(15) 110 → Central de Equipes(26) 160 → Chat(4) 170 → Monitor de Logs(7) 190 → Sair (`&LOGOUT_URL.`) 10000. Páginas 5, 6, 8 não estão no menu (5 e 6 são acessadas pelo header da Global Page).\n- Breadcrumb único `breadcrumb` (shared component): entradas planas (sem hierarquia/parent) para 1, 2, 3, 5, 6, 7, 11, 12, 13, 14, 15, 26. Páginas 14 e 15 não exibem região breadcrumb (14 não tem; 15 tem).\n\n---\n\n## 3. Contexto global usado pelas páginas\n\n- **Application items** (`app-items.apx`): `APP_USER_CARGO`, `APP_USER_FOTO`, `APP_USER_NOME` (não preenchido por nenhum processo visto), `G_NOME_EMPRESA`, `G_NOME_USUARIO`.\n- **Application processes** (`app-processes.apx`, todos `executeCode`, `sequence: 1`, ponto de execução não explícito no .apx):\n  - `APP_USER_CARGO`: `CARGO.nome` via `COLABORADOR.login_apex = :APP_USER` (UPPER/TRIM); fallbacks 'SEM VÍNCULO' / 'MÚLTIPLOS VÍNCULOS' / 'ERRO AO CARREGAR CARGO'.\n  - `APP_USER_FOTO`: `'#APP_FILES#fotos/' || foto_url` ou `'#APP_FILES#default-user.jpeg'`.\n  - `G_NOME_EMPRESA`: `EMPRESA.nome` do colaborador logado; fallback com texto de erro + usuário.\n  - `G_NOME_USUARIO`: `initcap(first_name||' '||last_name)` de `apex_workspace_apex_users` (usuários do workspace APEX, não da tabela COLABORADOR); fallback `:APP_USER`.\n- **LOVs compartilhadas** (`lovs.apx`): `boolean` (estática Yes/TRUE, No/FALSE), `colaborador-nome-completo` (COLABORADOR), `departamento-nome` (DEPARTAMENTO), `empresa-nome` (EMPRESA). Nenhuma filtra por empresa.\n- O vínculo usuário APEX ↔ colaborador é sempre `COLABORADOR.LOGIN_APEX = :APP_USER` (às vezes com UPPER, às vezes sem — ver pegadinhas).\n\n---\n\n## 4. Páginas em detalhe\n\n### Página 0 — Global Page (`p00000-global-page.apx`)\n- **Propósito**: regiões renderizadas em todas as páginas (header customizado).\n- **Regiões**:\n  - `novo` \"Barra de Busca\" — staticContent, slot `afterLogo`, template @/standard com `t-Region--removeHeader js-removeLandmark`, `t-Region--noUI`, `t-Region--scrollBody`. HTML: `<div class=\"corlix-header__search\">` com ícone `fa-search` e `<input id=\"P0_SEARCH_GLOBAL\" class=\"corlix-header__search-input\" placeholder=\"Buscar na intranet...\">`. **Não é um page item** (input HTML puro) e **não há JS/DA associado** → busca sem funcionalidade.\n  - `perfil` \"Perfil\" — staticContent, slot `afterNavigationBar`. HTML: link sino `fa-bell-o` → `r/corlixhub/&APP_ALIAS./notificacoes?session=&SESSION.` (página 5), link engrenagem `fa-cog` → `.../configuracoes` (página 6), bloco usuário com `&G_NOME_USUARIO.`, `&APP_USER_CARGO.`, `<img src=\"&APP_USER_FOTO.\">` (classes `corlix-header__*`).\n- **Pegadinhas**: os hrefs são relativos e começam com `r/corlixhub/...` (sem `/` inicial nem `f?p`); a resolução depende da URL corrente (friendly URL `/ords/r/<workspace>/<alias>/<page>`) e pode gerar caminho duplicado — conferir no browser. Prefira `f?p=&APP_ID.:5:&SESSION.` ou `apex.util.makeApplicationUrl`. Slots `afterLogo`/`afterNavigationBar` existem no `@corlix-standard-page`; páginas com `@/standard` podem renderizar o header de forma diferente.\n\n### Página 1 — Home (`p00001-home.apx`)\n- **Propósito**: dashboard inicial (boas-vindas, comunicados recentes, gestor, links rápidos, aniversariantes do mês).\n- **Layout** (grid 12 colunas):\n  - `container-conteudo-principal` (staticContent, @/blank-with-attributes, slot body, `columnSpan: 8`, `columnCssClasses: .container-conteudo-principal` ← **com ponto, bug**: a classe gerada será literalmente `.container-conteudo-principal`).\n    - `card-boas-vindas` (seq 10): `<h1>Bem-vindo, &G_NOME_USUARIO.! 👋<\/h1>` + texto com `<a href=\"#\" class=\"link-empresa\">&G_NOME_EMPRESA.<\/a>` (link morto). Classes `card-default card-boas-vindas`.\n    - `card-comunicados-oficiais` (seq 30): htmlCode `<h2> Comunicados Oficiais <\/h2>`, classes `card-default card-comunicados-oficiais`.\n      - `id-lista-de-comunicados` (cards, template customizado `@cards-container-image-first`, `t-CardsRegion--hideHeader`, layout horizontal, `columnCssClasses: lista-de-comunicados`). SQL: `COMUNICADO c LEFT JOIN DEPARTAMENTO d`, colunas ID_COMUNICADO, TITULO, `DBMS_LOB.SUBSTR(CONTEUDO,250,1)`, DATA_PUBLICACAO, IMAGEM, MIME_TYPE, NOME_ARQUIVO, `NVL(d.NOME,'Geral') DEPARTAMENTO`, `CLASSE_DEPTO` ('dept-'||MOD(id,6)), `TEMPO_PUBLICACAO` ('Hoje'/'Ontem'/'N dias atrás' via `TRUNC(SYSDATE)`), `ORDER BY DATA_PUBLICACAO DESC FETCH FIRST 3 ROWS ONLY`. Title HTML: `<span class=\"cx-etiqueta\">&DEPARTAMENTO.<\/span><span class=\"cmt-date\">&TEMPO_PUBLICACAO.<\/span><div class=\"cmt-title\">&TITULO.<\/div>`; body = CONTEUDO; media = BLOB `IMAGEM` (mime `MIME_TYPE`), posição first, classe `imagem-capa-comunicado`.\n        - `botao-emitir-comunicado` (staticContent filho da região de cards, slot subRegions, `columnCssClasses: emitir-comunicado`) contendo o botão `emitir-comunicado`.\n  - `container-conteudo-diversos` (seq 40, `columnSpan: 4`, `startNewRow: false`, classe `container-conteudo-diversos`):\n    - `card-meu-gestor` (cards, @/cards-container, `t-CardsRegion--hideHeader`, classes `card-default card-meu-gestor`). SQL: `COLABORADOR C JOIN COLABORADOR G ON G.ID_COLABORADOR = C.ID_GESTOR JOIN CARGO CG ON CG.ID_CARGO = G.ID_CARGO WHERE C.LOGIN_APEX = :APP_USER` → NOME_CARGO, NOME_GESTOR (PRIMEIRO_NOME||' '||ULTIMO_NOME), FOTO_GESTOR (`'#APP_FILES#fotos/'||FOTO_URL` ou default). Header `<h3>Meu gestor<\/h3>`, footer com dois botões `t-Button` \"Chat\"/\"E-mail\" com `href=\"#\"` (mortos). Title HTML `cx-pessoa` com `onerror` → `#APP_FILES#default-user.jpeg`. SQL termina com `;` (ver pegadinhas).\n    - `links-rapidos` (seq 40, staticContent): 3 `.link-item` com `onclick=\"apex.navigation.redirect('f?p=&APP_ID.:N:&SESSION.')\"`: \"Holerite Digital\" → **página 5** (Notificações), \"Ponto Eletrônico\" → **página 6** (Configurações), \"Suporte TI\" → **página 7** (Monitor de Logs). Destinos são placeholders/incorretos. SVGs usam `currentColor`.\n    - `card-aniversariantes` (seq 50, staticContent): cabeçalho `<div class=\"cx-cabecalho-card\"><h3>Aniversariantes<\/h3><span class=\"figma-badge-mes cx-badge cx-badge--info\"><\/span><\/div>` (badge preenchido via JS).\n      - `lista-aniversariantes` (type cards, mas template `@/blank-with-attributes`): SQL sobre `COLABORADOR` filtrando mês de nascimento = mês atual em `America/Sao_Paulo` (`CAST(SYSTIMESTAMP AT TIME ZONE 'America/Sao_Paulo' AS DATE)`), colunas ID_COLABORADOR, NOME_COMPLETO, DATA_DE_NASCIMENTO, FOTO_URL (`'#APP_FILES#Fotos Colaboradores/'||FOTO_URL`), NOME, DESCRICAO ('Hoje' / 'Amanhã, DD de Mês' / 'DD de Mês'), CSS_NIVER_HOJE ('is-birthday-today'/'is-normal-day'), MES_CORRENTE; `ORDER BY EXTRACT(DAY ...) FETCH FIRST 5 ROWS ONLY;`. Title HTML `figma-row &CSS_NIVER_HOJE.` com avatar (`onerror` default), nome, data e ícone 🎂 (visível só via CSS em `is-birthday-today`).\n  - `POPUP_ANIVERSARIANTES` (cards, slot `dialogsDrawersAndPopups`, template `@/inline-dialog` com `js-dialog-autoheight js-dialog-size600x400`, classe `popup-todos-aniversariantes`, title \"TODOS OS ANIVERSARIANTES DO MÊS\", `lazyLoading: true`, media `u-circle`). Mesma SQL da lista sem o `FETCH FIRST 5`.\n- **Itens**: nenhum.\n- **Botões**: `B_VER_TODOS` (\"Ver todos\", @/text-with-icon, `t-Button--noUI t-Button--iconRight`, `fa-arrow-right`, classe `figma-footer-link`, slot `next` de `lista-aniversariantes`, ação via DA). `emitir-comunicado` (buttonName `botao_emitir_comunicado`, \"Novo comunicado\", `fa-plus`, `t-Button--iconLeft`, classe `botao-emitir-comunicado`) → `redirectThisApp` página 17 (sem autorização).\n- **Dynamic actions**: `carregar-mês-no-badge` (event `ready`, JS: `new Date().toLocaleString('pt-BR',{month:'long'})` capitalizado → `.figma-badge-mes.innerText`); `abrir-popup-aniversariantes` (click em B_VER_TODOS → `openRegion` POPUP_ANIVERSARIANTES).\n- **JS da página** (`javaScript.exe nitialization, beforeHeader); `salvar-dados-colaborador` (formAutoRowProcessing, afterSubmit seq 10, msg \"Colaborador cadastrado com sucesso!\"); `criar-usuario-apex` (executeCode, afterSubmit seq 20): `APEX_UTIL.CREATE_USER(p_user_name=>:P14_LOGIN, p_email_address=>:P14_EMAIL, p_web_password=>:P14_SENHA, p_first_name=>:P14_PRIMEIRO_NOME, p_last_name=>:P14_ULTIMO_NOME, p_change_password_on_first_use=>'N')`, `WHEN OTHERS` → `raise_application_error(-20000, SQLERRM||backtrace)` (mesma mensagem de sucesso duplicada).\n- **Branch**: \"Limpar formulário após carregamento\" (point processing) → página 14 com `clearCache: 14`, `action: clearRegions`.\n- **Banco**: COLABORADOR (insert), EMPRESA, DEPARTAMENTO, CARGO; API `APEX_UTIL.CREATE_USER` (usuário do workspace — por isso `G_NOME_USUARIO` lê `apex_workspace_apex_users`).\n- **Pegadinhas**:\n  - Página sem autorização; só a entrada de menu exige `somente-diretoria`.\n  - Senha/confirmação/login não são obrigatórios, mas `CREATE_USER` precisa deles; com ambos nulos a validação retorna NULL (`NULL = NULL`) — APEX trata como falha com mensagem enganosa.\n  - Grupos/roles (Diretoria, Publicador, Equipe) não são atribuídos ao criar o usuário (`p_group_ids` não usado).\n  - O DA de habilitar/desabilitar depende do comportamento padrão \"fire on initialization\"; itens desabilitados no cliente não são enviados no submit (se o usuário limpar a empresa).\n  - LOV de gestor depende do nome literal de cargo `'Gestor'` e não filtra por empresa.\n  - Form só faz insert (não há fluxo de edição; sem link para cá com ID).\n  - Mudança não commitada: CARGO, DEPARTAMENTO, EMAIL, EMPRESA e NOME_COMPLETO passaram de `@/optional-floating` para `@/required-floating`; header trocou estilo inline por classes `cx-titulo`/`cx-descricao`.\n\n### Página 15 — Empresas Cadastradas (`p00015-empresas-cadastradas.apx`)\n- **Propósito**: listar empresas (tenants) e abrir o modal de cadastro/edição.\n- **Regiões**: `breadcrumb`; `empresas-cadastradas` (IR sobre a **tabela** `EMPRESA`, link de linha com ícone `fa-edit` → página 16 com `P16_ID_EMPRESA = #ID_EMPRESA#`, `resetPagination`). Colunas: ID_EMPRESA (hidden, PK), NOME (\"Razão Social\"), CNPJ, DATA_CRIACAO, NOME_FANTASIA, EMAIL_CORPORATIVO, TELEFONE, CEP, LOGRADOURO, NUMERO, COMPLEMENTO, BAIRRO, CIDADE, UF, STATUS (LOV `@boolean`). Mensagens \"no data\" em inglês. LOGOTIPO_EMPRESA não exibido.\n- **Botão**: `create` (\"Cadastrar\", hot, slot `rightOfInteractiveReportSearchBar`) → página 16 `clearCache: 16`.\n- **DA**: `edit-report-dialog-closed` (`apexafterclosedialog` na região) → refresh do IR.\n- **Banco**: EMPRESA.\n- **Pegadinhas**: sem autorização na página (menu exige `administration-rights`). Lista todas as empresas (é tela de administrador da plataforma).\n\n### Página 16 — Cadastro de Empresas (`p00016-cadastro-de-empresas.apx`)\n- **Propósito**: modal de CRUD da tabela EMPRESA, com autopreenchimento de endereço via ViaCEP.\n- **Página**: `pageMode: modalDialog`, `@/modal-dialog`, `chained: false`.\n- **Regiões**: `cadastro-de-empresas` (form EMPRESA, `edit.enabled` add/update/delete, @/blank-with-attributes, slot contentBody) com sub-regiões (sem UI, header `<h2 class=\"cx-titulo-secao\">`): `new` \"Informações principais\" (seq 10), `contato-e-endereço` (seq 40), `configurações` (seq 50); `buttons` (@/buttons-container, slot dialogFooter).\n- **Itens** (form `@cadastro-de-empresas`, largura 32): P16_ID_EMPRESA (hidden PK); em \"Informações\": P16_NOME (Razão Social, req, 200), P16_NOME_FANTASIA (req, 255), P16_CNPJ (req, 20), P16_DATA_CRIACAO (datePicker nativo `YYYY-MM-DD`, req, maxLength 255 sem sentido); em \"Contato e endereço\": P16_EMAIL_CORPORATIVO (email, lower, req, 255), P16_TELEFONE (phone, req, **max 12**), P16_CEP (req, **max 8** — CEP com hífen tem 9), P16_LOGRADOURO (req, 100), P16_NUMERO (req, **max 4**), P16_COMPLEMENTO (opc, 30), P16_BAIRRO (req, 50), P16_CIDADE (req, 100), P16_UF (req, 2); em \"Configurações\": P16_STATUS (switch boolean, req), P16_LOGOTIPO_EMPRESA (imageUpload, `storage.type: appTempFiles`, coluna BLOB LOGOTIPO_EMPRESA).\n- **Botões**: `cancel` (cancelDialog), `delete` (\"Remover\", `t-Button--danger`, sem validações, confirmação `&APP_TEXT$DELETE_MSG!RAW.`, só se ID não nulo), `save` (\"Salvar\", update, só se ID não nulo), `create` (\"Criar\", insert, só se ID nulo).\n- **DAs**:\n  - `endereço-por-cep` (keyup em P16_CEP): remove não-dígitos; com 8 dígitos faz `fetch('https://viacep.com.br/ws/${cep}/json/')`, preenche LOGRADOURO, BAIRRO, CIDADE (=localidade), UF; habilita NUMERO e COMPLEMENTO e foca NUMERO; se `data.erro`, `apex.message.showErrors` \"CEP não encontrado.\" e desabilita NUMERO/COMPLEMENTO.\n  - `desabilitar-campos-de-endereço` (change em P16_CEP, condição `itemIsNotNull P16_CEP`): verdadeiro → `enable` NOME_FANTASIA, NOME, CNPJ, DATA_CRIACAO, EMAIL_CORPORATIVO, TELEFONE, CEP, STATUS, LOGOTIPO (campos que nunca são desabilitados — ação sem efeito útil); falso → `disable` LOGRADOURO, BAIRRO, CIDADE, UF, NUMERO, COMPLEMENTO.\n- **Processos**: `initialize-form-cadastro-de-empresas` (formInitialization, beforeHeader); `process-form-cadastro-de-empresas` (formAutoRowProcessing, seq 10); `close-dialog` (closeDialog, seq 50, quando REQUEST em CREATE,SAVE,DELETE).\n- **Banco**: EMPRESA. Serviço externo: ViaCEP (chamado do browser).\n- **Pegadinhas**:\n  - LOGRADOURO/BAIRRO/CIDADE/UF ficam **desabilitados** mesmo após o ViaCEP preenchê-los (o JS só reabilita NUMERO/COMPLEMENTO). Itens desabilitados pelo APEX não são enviados no submit → risco de \"valor obrigatório\" ou de gravar nulo. Verificar no browser; correção: usar readonly via JS (`prop('readOnly')`) ou habilitar antes do submit.\n  - Na edição de uma empresa existente, a DA de change (com fire-on-init padrão) avalia CEP não nulo → não desabilita; mas em criação tudo de endereço começa desabilitado, inclusive NUMERO/COMPLEMENTO até o ViaCEP responder.\n  - `maxLength` de TELEFONE (12), CEP (8) e NUMERO (4) são restritivos para formatos com máscara.\n  - `appTempFiles` em item com coluna BLOB de form: o upload vai para `APEX_APPLICATION_TEMP_FILES`; não há processo copiando para `EMPRESA.LOGOTIPO_EMPRESA` → logotipo provavelmente não é salvo (verificar).\n  - Mudança não commitada: headers das seções viraram `<h2 class=\"cx-titulo-secao\">`; botão Remover ganhou `t-Button--danger`.\n\n### Página 17 — Emitir Comunicado (`p00017-comunicado.apx`)\n- **Propósito**: modal (wizard template, altura 600) para publicar um comunicado.\n- **Regiões**: `buttons` (slot wizardButtons); `step-1` \"emitir-comunicado\" (form sobre `COMUNICADO`, slot wizardBody, title \"Emitir novo comunicado\").\n- **Itens** (form `@step-1`; **todos com `sequence: 10`** → ordem de exibição indefinida/por nome):\n  - P17_ID_COMUNICADO (hidden PK, queryOnly).\n  - P17_TITULO (textField, req, 200, label \"Titulo\").\n  - P17_CONTEUDO (textarea CLOB, h=5).\n  - P17_ID_DEPARTAMENTO (selectList; LOV: departamentos da empresa do usuário logado via subquery `COLABORADOR.login_apex = :APP_USER`).\n  - P17_IMAGEM (imageUpload na coluna BLOB IMAGEM, `mimeTypeColumn: MIME_TYPE`, `filenameColumn: NOME_ARQUIVO`).\n  - P17_MIME_TYPE, P17_NOME_ARQUIVO (hidden, colunas).\n  - P17_DATA_PUBLICACAO (hidden, default expression `SYSDATE;`).\n  - P17_ID_AUTOR (hidden, default SQL `SELECT ID_COLABORADOR FROM COLABORADOR WHERE LOGIN_APEX = :APP_USER;`).\n  - P17_ID_EMPRESA (hidden, checksum, default SQL `SELECT ID_EMPRESA FROM COLABORADOR WHERE LOGIN_APEX = :APP_USER;`).\n- **Botões**: `cancel` (buttonName `cancelar`, cancelDialog); `next` (buttonName `enviar_comunicado`, \"Enviar Comunicado\", `fa-chevron-right`, insert, showProcessing, confirmação \"Certeza que deseja emitir o comunicado?\").\n- **Processos**: `initialize-form-emitir-comunicado` (formInitialization); `processo-emissao-comunicado` (formAutoRowProcessing, target tabela COMUNICADO, sucesso \"Comunicado Publicado com Sucesso!\", erro \"Não foi possível emitir o comunicado, tente novamente.\").\n- **Banco**: COMUNICADO (insert), COLABORADOR, DEPARTAMENTO.\n- **Pegadinhas**:\n  - **Não há processo `closeDialog` nem branch** → após inserir, o modal não fecha (recarrega a si mesmo); a Home não é atualizada.\n  - Default `SYSDATE;` com ponto e vírgula em \"PL/SQL expression\" pode gerar erro de compilação (deveria ser `SYSDATE`). Defaults SQL também terminam com `;`.\n  - `buttonName` em minúsculas (`cancelar`, `enviar_comunicado`) — REQUEST será esse nome; a DML automática usa `databaseAction: insert` do botão, então funciona.\n  - Template wizard + lista `emitir-comunicado` aponta para páginas 18 e 19 inexistentes (wizard abandonado em 1 passo).\n  - P17_ID_DEPARTAMENTO opcional: nulo = \"Geral\" na Home.\n  - Sem autorização na página; só o menu exige `publicador-de-conteudo`, e o botão da Home é livre.\n  - P17_TITULO usa `@/optional-floating` apesar de `valueRequired: true`.\n\n### Página 26 — Central de Equipes (`p00026-central-de-equipes.apx`)\n- **Propósito**: listar equipes e abrir modal de criação/edição.\n- **Regiões**: `navegação-estrutural` (breadcrumb); `central-de-equipes` (classicReport sobre **tabela** `EQUIPE`, @/standard `t-Region--noPadding`, report @/standard com `t-Report--stretch/staticRowColors/rowHighlight/inline/hideNoPagination`). Colunas: ID_EQUIPE (link ícone `fa-edit` → página 27 com `P27_ID_EQUIPE=#ID_EQUIPE#`), ID_EMPRESA (LOV `@empresa-nome`), ID_DEPARTAMENTO (`@departamento-nome`), ID_CRIADOR (`@colaborador-nome-completo`), NOME, DESCRICAO, DATA_CRIACAO, STATUS (`@boolean`). Cabeçalhos são os gerados (\"Id Empresa\", \"Data Criacao\" etc.).\n- **Botão**: `create` (\"Criar\", slot `edit`) → página 27 `clearCache: 27`.\n- **DA**: `editar-relatório-caixa-de-diálogo-fechada` (`apexafterclosedialog`) → refresh do relatório.\n- **Banco**: EQUIPE (+ EMPRESA, DEPARTAMENTO, COLABORADOR via LOVs).\n- **Pegadinhas**: sem filtro por empresa (multi-tenant); sem autorização; rótulos não traduzidos/polidos.\n\n### Página 27 — Nova Equipe (`p00027-nova-equipe.apx`)\n- **Propósito**: modal CRUD de EQUIPE.\n- **Regiões**: `nova-equipe` (form EQUIPE, add/update/delete); `botões` (dialogFooter).\n- **Itens**: P27_ID_EQUIPE (hidden PK); P27_ID_EMPRESA (selectList `@empresa-nome`, req); P27_ID_DEPARTAMENTO (selectList `@departamento-nome`, opc); P27_ID_CRIADOR (selectList `@colaborador-nome-completo`, req); P27_NOME (req, 150); P27_DESCRICAO (textarea, 500); P27_DATA_CRIACAO (datePicker, req, maxLength 255); P27_STATUS (switch boolean, req). Labels alinhados à direita, nomes técnicos (\"Id Criador\").\n- **Botões**: `cancel` (cancelDialog), `delete` (\"Excluir\", danger, confirmação, se ID não nulo), `save` (\"Aplicar Alterações\", se ID não nulo), `create` (\"Criar\", se ID nulo).\n- **Processos**: formInitialization; formAutoRowProcessing; `fechar-caixa-de-diálogo` (closeDialog quando CREATE,SAVE,DELETE).\n- **Pegadinhas**: LOVs não filtradas por empresa nem em cascata (departamento de outra empresa pode ser escolhido); criador escolhido manualmente (deveria ser o usuário logado); data de criação digitada manualmente. Mudança não commitada: botão Excluir ganhou `t-Button--danger`.\n\n### Página 9999 — Login (`p09999-login.apx`)\n- Página padrão gerada pelo APEX: `@/login`, `authentication: public`, title \"CorlixHub - Log In\".\n- **Região** `corlixhub` (template @/login, imagem `#APP_FILES#icons/app-icon-512.png`).\n- **Itens**: P9999_USERNAME (textField, ícone `fa-user`, `autocomplete=\"username\"`, storage request), P9999_PASSWORD (password, `fa-key`, `autocomplete=\"current-password\"`), P9999_REMEMBER (checkbox, só se `apex_authentication.persistent_cookies_enabled`). Labels em inglês (\"Username\", \"Password\", \"Remember username\").\n- **Botão**: `login` (LOGIN, \"Sign In\", hot).\n- **Processos**: `get-username-cookie` (beforeHeader: lê cookie de usuário); `set-username-cookie` (seq 10, `APEX_AUTHENTICATION.SEND_LOGIN_USERNAME_COOKIE(lower(:P9999_USERNAME), :P9999_R er `t-Button--danger`.\n- **Página 27**: botão Excluir `t-Button--danger`.\n\n---\n\n## 6. Mapa de navegação\n\n```\n                       [9999 Login] --(APEX_AUTHENTICATION.LOGIN)--> homeUrl = [1 Home]\n\nGlobal Page 0 (header em todas): sino -> [5 Notificações]   engrenagem -> [6 Configurações]\n\nMenu lateral: 1, 2, 3, 11, 12, 13, 14*, 17**, 15***, 26, 4, 7, Sair(&LOGOUT_URL.)\n   * somente-diretoria   ** publicador-de-conteudo   *** administration-rights\n\n[1 Home]\n  ├─ botão \"Novo comunicado\" ──────────────> [17 Emitir Comunicado] (modal; não fecha sozinho)\n  ├─ \"Ver todos\" ──────────────────────────> POPUP_ANIVERSARIANTES (inline dialog na própria página)\n  ├─ Link rápido \"Holerite Digital\" ───────> [5]   (placeholder)\n  ├─ Link rápido \"Ponto Eletrônico\" ───────> [6]   (placeholder)\n  ├─ Link rápido \"Suporte TI\" ─────────────> [7 Monitor de Logs]\n  └─ Meu gestor: \"Chat\"/\"E-mail\" e link da empresa -> href=\"#\" (mortos)\n\n[15 Empresas Cadastradas] ── \"Cadastrar\" (clear 16) / ícone editar (P16_ID_EMPRESA) ──> [16 Cadastro de Empresas] (modal)\n[16] ── CREATE/SAVE/DELETE ──> closeDialog ──> 15 refresca IR (apexafterclosedialog)\n\n[26 Central de Equipes] ── \"Criar\" (clear 27) / ícone editar (P27_ID_EQUIPE) ──> [27 Nova Equipe] (modal)\n[27] ── CREATE/SAVE/DELETE ──> closeDialog ──> 26 refresca relatório\n\n[14 Cadastro de Usuários] ── submit ──> branch para 14 (clearCache 14) ; \"Cancelar\" -> 14\n\n[4 Chat] — sem navegação; AJAX (DA) seleciona contato -> P4_CANAL_ID -> refresh msgs\n\nLista \"emitir-comunicado\" (wizard): 17 -> 18 -> 19   (18 e 19 NÃO EXISTEM)\nÓrfãs: [8 Notificações duplicada] (nenhum link). Páginas 2,3,11,12,13 só via menu, sem conteúdo.\n```\n\n---\n\n## 7. Tabelas, views e objetos de banco usados pelas páginas\n\n| Objeto | Tipo | Páginas |\n|---|---|---|\n| COLABORADOR | tabela | 1, 4, 14 (insert), 17 (defaults/LOV), 26/27 (LOV), app processes |\n| CARGO | tabela | 1, 4, 14 (LOV), app process APP_USER_CARGO |\n| DEPARTAMENTO | tabela | 1, 4, 14, 17, 26/27 (LOV) |\n| EMPRESA | tabela | 14 (LOV), 15 (IR), 16 (CRUD), 26/27 (LOV), app process G_NOME_EMPRESA |\n| COMUNICADO | tabela | 1 (top 3), 17 (insert) |\n| EQUIPE | tabela | 26 (report), 27 (CRUD) |\n| PRESENCA_COLABORADOR | tabela | 4 |\n| CANAL_MENSAGEM | tabela | 4 |\n| CH_GET_CANAL_DIRETO | função | 4 (DA server-side) |\n| APP_LOG / LOG_PKG | tabela / package | 7 |\n| APEX_WORKSPACE_ACTIVITY_LOG, APEX_DEBUG_MESSAGES, APEX_WORKSPACE_APEX_USERS | views APEX | 7, 7, app process G_NOME_USUARIO |\n| APEX_UTIL.CREATE_USER, APEX_AUTHENTICATION.* | APIs APEX | 14, 9999 |\n\nColunas relevantes inferidas: COLABORADOR(ID_COLABORADOR, NOME_COMPLETO, PRIMEIRO_NOME, ULTIMO_NOME, EMAIL, LOGIN_APEX, DATA_ADMISSAO, DATA_DE_NASCIMENTO, FOTO_URL, ID_EMPRESA, ID_DEPARTAMENTO, ID_CARGO, ID_GESTOR, STATUS boolean); CARGO(ID_CARGO, NOME, ID_DEPARTAMENTO, ID_EMPRESA); DEPARTAMENTO(ID_DEPARTAMENTO, NOME, ID_EMPRESA); EMPRESA(ID_EMPRESA, NOME, NOME_FANTASIA, CNPJ, DATA_CRIACAO, EMAIL_CORPORATIVO, TELEFONE, CEP, LOGRADOURO, NUMERO, COMPLEMENTO, BAIRRO, CIDADE, UF, STATUS boolean, LOGOTIPO_EMPRESA blob); COMUNICADO(ID_COMUNICADO, TITULO, CONTEUDO clob, DATA_PUBLICACAO, IMAGEM blob, MIME_TYPE, NOME_ARQUIVO, ID_DEPARTAMENTO, ID_AUTOR, ID_EMPRESA); EQUIPE(ID_EQUIPE, ID_EMPRESA, ID_DEPARTAMENTO, ID_CRIADOR, NOME, DESCRICAO, DATA_CRIACAO, STATUS boolean); PRESENCA_COLABORADOR(ID_COLABORADOR, DATA_ULTIMO_PING, STATUS_PRESENCA); CANAL_MENSAGEM(ID_CANAL, ID_COLABORADOR, CORPO, DATA_ENVIO, EXCLUIDA boolean); APP_LOG(ID, LOG_TS tstz, NIVEL, APP_ID, PAGE_ID, APEX_USER, SESSION_ID, ORIGEM, MENSAGEM, DETALHE clob).\nNenhum DDL dessas tabelas, nem `CH_GET_CANAL_DIRETO`/`LOG_PKG`, está versionado como `.sql` separado no repo (só `database/f100.sql`, que é o export do app, e os módulos novos em `modulos/`).\n\n---\n\n## 8. Pegadinhas transversais (checklist para quem for editar)\n\n1. **Autorização só no menu**: nenhuma página tem `authorizationScheme`; 7 (logs), 14 (cria usuários), 15/16 (empresas) e 17 (comunicados) são acessíveis por URL por qualquer usuário autenticado. Para proteger, adicionar `security { authorizationScheme: @... }` na página.\n2. **Multi-tenant ausente nas consultas**: quase nenhuma SQL filtra por `ID_EMPRESA` do usuário (exceção: LOV de departamento da página 17).\n3. **Duas páginas de Notificações** (5 implementada como placeholder com breadcrumb e alias ASCII `NOTIFICACOES`, usada pelo header; 8 vazia, alias `NOTIFICAÇÕES`, órfã).\n4. **Aliases e nomes de arquivo com acento** (8, 13) — cuidado com URLs amigáveis e scripts.\n5. Chat: região de mensagens condicionada no servidor + refresh por DA = não funciona; `templateOptions: \"[object Object]\"`; CAB_DEPT só para admins; sem envio.\n6. Modal 17 sem closeDialog; wizard aponta para 18/19 inexistentes; `SYSDATE;` no default.\n7. Modal 16: campos de endereço desabilitados (não submetidos); maxLengths curtos; logotipo em `appTempFiles`.\n8. Caminhos de foto divergentes: `#APP_FILES#fotos/` vs `#APP_FILES#Fotos Colaboradores/`.\n9. Links mortos/placeholder: busca global sem JS, `href=\"#\"` (gestor, empresa), links rápidos apontando para 5/6/7.\n10. Comparações de `LOGIN_APEX` ora com `UPPER`, ora sem (Home gestor, 17, lado do chat) — padronizar `UPPER(TRIM(login_apex)) = UPPER(:APP_USER)`.\n11. Templates de página misturados: `@/standard` (1, 2, 3, 8, 11, 12, 13, 14, 15) vs `@corlix-standard-page` (4, 5, 6, 7, 26) — o header da Global Page usa slots `afterLogo`/`afterNavigationBar` definidos no template customizado.\n12. Ao editar `.apx`: preservar `executionMappingIdentifier`/`savedReportMappingIdentifier`, manter escape `\\#COL#\\` em targets, uma opção por linha em listas, e blocos de código cercados com a linguagem correta (`javascript-browser`, não `javascript`).\n"}, {"arquivo": "03-componentes-compartilhados.md", "titulo": "03 — Componentes compartilhados (Shared Components) da app 100 CORLIXHUB", "md": "# 03 — Componentes compartilhados (Shared Components) da app 100 CORLIXHUB\n\n> Fonte: `corlixhub/application.apx`, `corlixhub/page-groups.apx`, `corlixhub/.apex/`, `corlixhub/deployments/`,\n> `corlixhub/supporting-objects/`, `corlixhub/shared-components/**` e trechos de `database/f100.sql` (via grep).\n> Estado conferido em 2026-10-06, branch `DEV`, **com mudanças não commitadas** (ver §13).\n> APEXlang: `mmdVersion` `26.1.0+3102` (`corlixhub/.apex/apexlang.json`); export SQL diz `Version: 26.1.5`, `p_compatibility_mode=>'26.1'`.\n\n---\n\n## 1. Configuração da aplicação (`corlixhub/application.apx`)\n\n| Item | Valor | Observação |\n|---|---|---|\n| Alias / nome | `CORLIXHUB` / `Corlix Hub` | Owner/schema `WKSP_CORLIXHUB` (f100.sql). |\n| Logo | tipo `text`, texto `CorlixHub` | Renderizado em `#LOGO#` do page template. |\n| Home | página `1` | URL: `f?p=&APP_ID.:1:&APP_SESSION.::&DEBUG.:::` |\n| Login | página `LOGIN` (= 9999) | |\n| Autenticação | `@oracle-apex-accounts` (tipo `oracleApexAccounts`) | Usuários são **contas do workspace APEX**; não há esquema custom nem post-authentication procedure. |\n| Navigation menu | lista `@navigation-menu`, template `@/side-navigation-menu`, posição `side` | Template options: `#DEFAULT#`, `js-defaultCollapsed`, `js-navCollapsed--default`, `t-TreeNav--styleA` → menu lateral **começa recolhido** (só ícones). |\n| Navigation bar | `implementation: classic` | Nenhuma lista explícita; o default do tema é `@/navigation-bar`. O cabeçalho real (busca, sino, engrenagem, avatar) vem da **Global Page 0** (ver §1.2). |\n| Tema | `@universal-theme` (UT 42, `ut-26.1`, estilo `Redwood Light`) | `globalPage: 0`; `addBuiltWithApexToFooter: false`. |\n| Máscaras de formato | `date: DS`, `timestamp: DS`, `timestampTimeZone: DS` | `DS` = formato curto da NLS da sessão. Como `p_flow_language=>'en'` (idioma primário **inglês**, derivado de `FLOW_PRIMARY_LANGUAGE`), datas podem sair no padrão americano se a NLS do banco não for pt-BR. Formate explicitamente (`to_char(..., 'dd/mm/yyyy')`) quando importar. |\n| CSS globais | `#APP_FILES#corlix-tema#MIN#.css`, depois `#APP_FILES#custom#MIN#.css` | Ordem importa (tema → ajustes). **Mudança não commitada** (§13). |\n| Segurança | `runtimeApiUsage: modifyWorkspaceRepository` (`p_runtime_api_usage=>'W'`) | Permite APIs de runtime alterarem o repositório do workspace (ex.: `apex_util.create_user` na tela de cadastro de usuários). |\n| Session State Protection | habilitado (`p_page_protection_enabled_y_n=>'Y'`), `checksumSalt` fixo, `p_bookmark_checksum_function=>'SH512'` | Todas as páginas normais usam `pageAccessProtection: argumentsMustHaveChecksum` → **links com parâmetros precisam ser gerados por APEX** (`apex_page.get_url`, link builder, `f?p` com `:...` não funciona sem checksum). App items têm `p_protection_level=>'I'` (não podem ser setados pelo browser). |\n| Error handler | `errorHandlingFunctionName: log_pkg.apex_error_handler` | **O package `log_pkg` NÃO existe no repositório** (ver §11). |\n| Runtime | `allowFeedback: true` | Feedback habilitado. |\n| Substituição | `APP_NAME` = `CorlixHub` | Use `&APP_NAME.` em textos. Em `supporting-objects/substitutions.apx` aparece `substitution APP_NAME ( )` vazio (artefato do export; valor real está em application.apx). |\n| Outros (f100.sql) | `p_flow_version=>'Release 1.0'`, `p_flow_status=>'AVAILABLE_W_EDIT_LINK'`, `p_browser_cache=>'N'`, `p_rejoin_existing_sessions=>'N'`, `p_exact_substitutions_only=>'Y'`, `p_file_storage=>'DB'`, `p_is_pwa=>'Y'` (não instalável, sem push), `p_page_view_logging=>'YES'`, `p_theme_style_by_user_pref=>false` | |\n\n### 1.1 Deployment / página de grupos / supporting objects\n- `corlixhub/deployments/default.json`: `{\"app\":{\"id\":100,\"runtime\":{\"debugging\":true}}}` → **debug habilitado** no deploy padrão (desligue em produção).\n- `corlixhub/page-groups.apx`: um único grupo `administration` (\"Administration\"). Nenhuma página o referencia (grep em `pages/` sem `pageGroup`/`group:`).\n- `corlixhub/supporting-objects/supporting-objects.apx`: só `includeInAppExport: true`. **Não há install/upgrade/deinstall scripts**: em `f100.sql`, `create_install` tem `p_deinstall_script_clob` vazio, `deployment/checks` e `deployment/buildoptions` são `null;`. Ou seja, **importar a app NÃO cria tabelas, packages nem dados**.\n\n### 1.2 Cabeçalho global (Global Page 0 — referência cruzada)\nA Page 0 (`pages/p00000-global-page.apx`) injeta duas regiões Static Content (template `@/standard` com `t-Region--removeHeader js-removeLandmark t-Region--noUI t-Region--scrollBody`):\n- slot `afterLogo`: busca `<input id=\"P0_SEARCH_GLOBAL\" class=\"corlix-header__search-input\">` (HTML puro, não é item APEX).\n- slot `afterNavigationBar`: links para notificações/configurações + `&G_NOME_USUARIO.`, `&APP_USER_CARGO.`, `<img src=\"&APP_USER_FOTO.\">`.\n  - Os links são **hardcoded**: `r/corlixhub/&APP_ALIAS./notificacoes?session=&SESSION.` e `.../configuracoes?...` (caminho do workspace `corlixhub` fixo; depende de friendly URLs e dos aliases `NOTIFICACOES` (p5) e `CONFIGURACOES` (p6)).\n  - Esses slots existem tanto no `@/standard` quanto no `@corlix-standard-page`.\n\n---\n\n## 2. Roles ACL e Authorization Schemes\n\n### 2.1 Roles (`acl-roles.apx`)\n| Static ID | Nome (usado nas authorizations) |\n|---|---|\n| `diretoria` | `Diretoria` |\n| `equipe-do-corlix-hub` | `Equipe do Corlix Hub` |\n| `publicador-de-conteúdo` | `Publicador de Conteúdo` (static id com acento) |\n\nAtribuição de usuários a roles é feita em *Shared Components > Application Access Control* (ou `apex_acl.add_user_role`); não está versionada no repo.\n\n### 2.2 Authorizations (`authorizations.apx`) — todas `isInRoleOrGroup`, avaliadas `perSession`\n| Static ID (referência `@...`) | Nome exibido | Role exigida | Mensagem de erro |\n|---|---|---|---|\n| `administration-rights` | `Equipe Corlix Hub` | `Equipe do Corlix Hub` | \"Acesso restrito à equipe do Corlix Hub.\" |\n| `publicador-de-conteudo` | `Publicador de Conteudo` | `Publicador de Conteúdo` | \"Acesso restrito a publicadores de conteúdo.\" |\n| `somente-diretoria` | `Somente Diretoria` | `Diretoria` | \"Acesso restrito à Diretoria.\" |\n\n`perSession` = resultado em cache na sessão: após mudar a role de alguém, o usuário precisa **novo login**.\n\n### 2.3 Quem acessa o quê (uso real)\n| Onde | Authorization |\n|---|---|\n| Menu \"Cadastro de Usuários\" (p14) | `@somente-diretoria` |\n| Menu \"Emitir Comunicado\" (p17) | `@publicador-de-conteudo` |\n| Menu \"Empresas Cadastradas\" (p15/16) | `@administration-rights` |\n| Coluna `CAB_DEPT` do relatório de contatos do Chat (p4) | `@administration-rights` (cabeçalho de departamento só aparece para a equipe Corlix — provavelmente acidental) |\n\n**Pegadinha de segurança:** nenhuma página tem `authorizationScheme` em nível de página. As authorizations só **escondem itens do menu**; qualquer usuário autenticado acessa p14, p15, p16, p17 e **p7 (Monitor de Logs, sem nenhuma authorization)** digitando a URL. Para proteger de verdade, colocar `security { authorizationScheme: @... }` no `page`.\nO módulo `modulos/historico-carreira/` prevê authorizations novas (ex.: `ADMIN_RH`) e o app item `G_ID_EMPRESA`, que **ainda não existem** nos shared components.\n\n---\n\n## 3. Application Items e Application Processes\n\n### 3.1 Items (`app-items.apx`) — todos com proteção `I` (Restricted)\n| Item | Populado por | Usado em |\n|---|---|---|\n| `APP_USER_CARGO` | processo `APP_USER_CARGO` | Page 0 (cabeçalho) |\n| `APP_USER_FOTO` | processo `APP_USER_FOTO` | Page 0 (`<img src=\"&APP_USER_FOTO.\">`) |\n| `APP_USER_NOME` | **ninguém** | **ninguém** (item órfão) |\n| `G_NOME_EMPRESA` | processo `G_NOME_EMPRESA` | Home p1 (\"Sua jornada de carreira na &G_NOME_EMPRESA.\") |\n| `G_NOME_USUARIO` | processo `G_NOME_USUARIO` | Page 0 e Home p1 (\"Bem-vindo, &G_NOME_USUARIO.!\") |\n\n### 3.2 Processes (`app-processes.apx`)\nTodos: `type: executeCode`, `sequence: 1`, ponto **`BEFORE_HEADER` (On Load: Before Header)** segundo `f100.sql`, **sem condição** → as 4 queries rodam **em toda renderização de página**, inclusive na página de login (onde `:APP_USER = 'nobody'` → cai nos `EXCEPTION`). Candidatos naturais a `On New Instance`/pós-autenticação.\n\nVínculo usuário APEX ↔ colaborador: `UPPER(TRIM(COLABORADOR.login_apex)) = UPPER(TRIM(:APP_USER))`.\n\n```plsql\n-- APP_USER_CARGO\nSELECT G.nome INTO :APP_USER_CARGO\n  FROM COLABORADOR C JOIN CARGO G ON G.id_cargo = C.id_cargo\n WHERE UPPER(TRIM(C.login_apex)) = UPPER(TRIM(:APP_USER));\n-- NO_DATA_FOUND → 'SEM VÍNCULO'; TOO_MANY_ROWS → 'MÚLTIPLOS VÍNCULOS'; OTHERS → 'ERRO AO CARREGAR CARGO'\n\n-- APP_USER_FOTO\nSELECT CASE WHEN C.foto_url IS NULL THEN '#APP_FILES#default-user.jpeg'\n            ELSE '#APP_FILES#fotos/' || C.foto_url END\n  INTO :APP_USER_FOTO\n  FROM COLABORADOR C WHERE UPPER(TRIM(C.login_apex)) = UPPER(TRIM(:APP_USER));\n-- qualquer exceção → '#APP_FILES#default-user.jpeg'\n\n-- G_NOME_EMPRESA\nSELECT E.nome INTO :G_NOME_EMPRESA\n  FROM COLABORADOR C JOIN EMPRESA E ON E.id_empresa = C.id_empresa\n WHERE UPPER(TRIM(C.login_apex)) = UPPER(TRIM(:APP_USER));\n-- NO_DATA_FOUND → 'SEM VINCULO - usuario: '||:APP_USER; TOO_MANY_ROWS → 'MULTIPLOS VINCULOS - usuario: '||:APP_USER; OTHERS → 'ERRO: '||SQLERRM\n\n-- G_NOME_USUARIO (não usa COLABORADOR!)\nselect initcap(first_name || ' ' || last_name) into :G_NOME_USUARIO\n  from apex_workspace_apex_users where upper(user_name) = upper(:APP_USER);\n-- no_data_found → :APP_USER\n```\n\nPegadinhas:\n- **Caminho da foto quebrado:** `APP_USER_FOTO` monta `#APP_FILES#fotos/<foto_url>`, mas a pasta registrada é `Fotos Colaboradores/` (§9). Não existe pasta `fotos/`. A Home (p1) tem a mesma inconsistência: o card \"Meu Gestor\" usa `'#APP_FILES#fotos/' || G.FOTO_URL`, enquanto aniversariantes usam `'#APP_FILES#Fotos Colaboradores/' || FOTO_URL`. O avatar do cabeçalho não tem `onerror` de fallback (os da Home têm).\n- `G_NOME_USUARIO` vem do cadastro de usuário do workspace (first/last name), não de `COLABORADOR.nome_completo` → nomes podem divergir.\n- `G_NOME_EMPRESA` expõe `SQLERRM` na tela em caso de erro.\n- Strings `#APP_FILES#` gravadas em item/coluna dependem da substituição feita pelo APEX ao renderizar o HTML (funciona em Static Content/HTML Expression como na Home); em PL/SQL puro o valor é literal.\n\n---\n\n## 4. Lists (`lists.apx`)\n\n### 4.1 `navigation-menu` (\"Navigation Menu\") — menu lateral, em ordem de `sequence`\n| Seq | Static ID | Label | Ícone | Destino | Current em páginas | Authorization |\n|---|---|---|---|---|---|---|\n| 10 | `home` | Home | `fa-home` | p1 | (padrão: p1) | — |\n| 20 | `meu-perfil` | Meu Perfil | `fa-user` | p2 | 2 | — |\n| 30 | `organograma` | Organograma | `fa-tree-org` | p3 | 3 | — |\n| 40 | `comunicação` | Comunicados | `fa-commenting-o` | p11 | 11 | — |\n| 50 | `colaboradores` | Colaboradores | `fa-users-alt` | p12 | 12 | — |\n| 60 | `histórico-de-carreira` | Histórico de carreira | `fa-workflow` | p13 | 13 | — |\n| 70 | `cadastros` | Cadastro de Usuários | `fa-user-plus` | p14 | 14 | `@somente-diretoria` |\n| 80 | `emitir-comunicado` | Emitir Comunicado | `fa-magic` | p17 (modal wizard) | 17 | `@publicador-de-conteudo` — **filho de `@home`** (`parentEntry: @home`), aparece como subitem de Home |\n| 110 | `empresas-cadastradas` | Empresas Cadastradas | `fa-building-o` | p15 | 15, 16 | `@administration-rights` |\n| 160 | `central-de-equipes` | Central de Equipes | `fa-table` | p26 | 26, 27 | — |\n| 170 | `chat` | Chat | `fa-comments-o` | p4 | 4 | — |\n| 190 | `terminal` | Monitor de Logs | `fa-terminal` | p7 | 7 | **nenhuma** |\n| 10000 | `sair` | Sair | `fa-box-arrow-out-east` | URL `&LOGOUT_URL.` | — | — |\n\nFora do menu: p5 (Notificações, acessada pelo sino do cabeçalho), p6 (Configurações, engrenagem), p8 (`NOTIFICAÇÕES`, página vazia/duplicada), p9999 (login). `custom.css` empurra o último item do menu para o rodapé (§9). Ícones são Font APEX (`icons.library: fontApex`), classes `fa-*`.\n\n### 4.2 `emitir-comunicado` (\"Emitir Comunicado\") — lista de wizard\nEntradas `Step 1` → p17, `Step 2` → p18, `Step 3` → p19. **Páginas 18 e 19 não existem** e a lista **não é referenciada por nenhuma página** (p17 usa `wizard-modal-dialog`, mas sem região Wizard Progress apontando para ela). Resto de geração automática. Atenção: o módulo histórico-de-carreira planeja usar os números 18–23 para outras páginas.\n\n---\n\n## 5. Breadcrumbs (`breadcrumbs.apx`)\nUm único breadcrumb `breadcrumb` (\"Breadcrumb\"). **Hierarquia plana**: todas as entradas têm `sequence: 10` e **nenhuma `parentEntry`** (nem \"Home\" é pai) → cada página mostra só o próprio nome.\n\n| Entry (static id) | Nome | Página / link |\n|---|---|---|\n| `home` | Home | 1 |\n| `meu-perfil` | Meu Perfil | 2 |\n| `organograma` | Organograma | 3 |\n| `notificações` | Notificações | 5 |\n| `configurações` | Configurações | 6 |\n| `terminal` | Monitor de Logs | 7 |\n| `comunicação` | Comunicação | 11 (no menu o label é \"Comunicados\") |\n| `colaboradores` | Colaboradores | 12 |\n| `histórico-de-carreira` | Histórico de carreira | 13 |\n| `cadastros` | Cadastro de Usuários | 14 |\n| `empresas-cadastradas` | Empresas Cadastradas | 15 |\n| `central-de-equipes` | Central de Equipes | 26 |\n\nPáginas com região Breadcrumb (`breadcrumb: @breadcrumb`, template de região `@/title-bar`): 2, 3, 5, 6, 7, 11, 12, 13, 15, 26. Sem breadcrumb: 1, 4, 8, 14 (tem entry mas não região), modais 16/17/27. Para adicionar hierarquia: `layout { parentEntry: @home }` na entry.\n\n---\n\n## 6. LOVs (`lovs.apx`)\n| Static ID | Nome | Tipo | Retorno / Exibição | Usada em |\n|---|---|---|---|---|\n| `boolean` | `BOOLEAN` | estática | `TRUE`→\"Yes\" (seq 1), `FALSE`→\"No\" (seq 2) — rótulos em inglês | Coluna `STATUS` (dataType `BOOLEAN`) em p15 e p26 |\n| `colaborador-nome-completo` | `COLABORADOR.NOME_COMPLETO` | tabela `COLABORADOR` | `ID_COLABORADOR` / `NOME_COMPLETO`, ordena por `NOME_COMPLETO` | p26, p27 |\n| `departamento-nome` | `DEPARTAMENTO.NOME` | tabela `DEPARTAMENTO` | `ID_DEPARTAMENTO` / `NOME` | p26, p27 |\n| `empresa-nome` | `EMPRESA.NOME` | tabela `EMPRESA` | `ID_EMPRESA` / `NOME` | p26, p27 |\n\nAs LOVs de tabela **não filtram por empresa** (multi-tenant) nem por `status` → mostram colaboradores/departamentos de todas as empresas.\n\n---\n\n## 7. Component Settings e Build Options\n- `component-settings.apx`: valores app-wide de plugins nativos. Relevantes: **Checkbox** `uncheckedValue: N`; **Switch** `onValue: Y` (portanto off = `N` padrão); **Date Picker** com `monthPicker`, `yearPicker`, `showTodayButton`; **Star Rating** tooltip `#VALUE#`; **Geocoded Address** `mapPreview: [resultsPopup, item]`. Demais (`showAiAssistant`, `colorPicker`, `selectMany`, `serverSideGeocoding`, `regionDisplaySelector`, `interactiveReport`, `map`, REST `oracleCloudAppsSaas`/`oracleCloudAppsBoss`) estão com defaults. Atenção: colunas do banco são `BOOLEAN` (23ai) em vários lugares, mas switch/checkbox gravam `Y`/`N`.\n- `build-options.apx`: só `commented-out` (\"Commented Out\", padrão APEX para excluir componentes). Não é referenciado por nenhum componente versionado.\n\n---\n\n## 8. Tema e templates customizados (`shared-components/themes/universal-theme/`)\n\n### 8.1 `theme.apx`\nUniversal Theme `themeNumber: 42`, `baseTheme: ut-26.1`, estilo atual `@/redwood-light`, ícones `fontApex`, `filePrefix: #APEX_FILES#themes/theme_42/26.1/`. JS: `widget.stickyWidget` + `theme42#MIN#.js`; CSS: `Core#MIN#.css`.\nDefaults de componente: **page = `@corlix-standard-page`** (páginas novas nascem com o template custom), login/erro = `@/login`, modal = `@/modal-dialog`, breadcrumb region = `@/title-bar`, região = `@/standard`, IR = `@/interactive-report`, labels = `optional-floating`/`required-floating`, botão = `@/text`, lista = `@/links-list`, nav menu side = `@/side-navigation-menu`.\n`themes/universal-theme/static-files/10245258954911381.css` e `10246955817960493.css`: 68 bytes cada, **só o comentário de copyright da Oracle** (criados por `EDUARDOMARINS` em 2026-07-08, provavelmente sobras de Theme Roller). Inócuos.\n\n### 8.2 Page template `corlix-standard-page` (\"Corlix - Standard Page\", class `oneLevelTabs`)\nUsado por: p4 Chat, p5 Notificações, p6 Configurações, p7 Monitor de Logs, p26 Central de Equipes. As demais páginas normais (1, 2, 3, 8, 11, 12, 13, 14, 15) usam explicitamente `@/standard`.\nÉ uma cópia simplificada do Standard do UT **sem colunas laterais**:\n- `<body class=\"t-PageBody t-PageBody--hideLeft t-PageBody--hideActions no-anim t-PageTemplate--standard #PAGE_CSS_CLASSES#\">`; JS on load `apex.theme42.initializePage.noSideCol();`. `<html>` recebe `page-&APP_PAGE_ID. app-&APP_ALIAS.` (use `.page-4 ...` para CSS por página).\n- Header `t-Header`: `#REGION_POSITION_07#` (banner), botão de colapsar menu `#t_Button_navControl`, `#LOGO#` + `#AFTER_LOGO#`, navbar com `#BEFORE_NAVIGATION_BAR#`, `#NAVIGATION_BAR#`, `#AFTER_NAVIGATION_BAR#`.\n- Body: `#SIDE_GLOBAL_NAVIGATION_LIST#`, `t-Body-title` = `#REGION_POSITION_01#` (breadcrumb bar), mensagens, `t-Body-fullContent` = `#REGION_POSITION_08#`, `t-Body-contentInner` = `#BODY#`, footer `#REGION_POSITION_05#` + `#APP_VERSION#`, inline dialogs `#REGION_POSITION_04#`.\n- Slots (nome APEXlang → posição): `afterLogo` (AFTER_LOGO), `beforeNavigationBar`, `afterNavigationBar` (itens/botões, sem grid, max 4), `banner` (POS_07), `breadcrumbBar` (POS_01), `body` (BODY, 12 col), `fullWidthContent` (POS_08), `footer` (POS_05), `dialogsDrawersAndPopups` (POS_04), `topNavigation` (POS_06).\n- **Pegadinha:** o slot `topNavigation` (`REGION_POSITION_06`) está declarado mas **não há `#REGION_POSITION_06#` no HTML** → regiões ali não aparecem. Também **não existem** slots de coluna esquerda/direita (`REGION_POSITION_02/03`) — não use \"Left Column\"/\"Right Column\" nesse template.\n- Navigation bar subtemplate: `<ul class=\"t-NavigationBar t-NavigationBar--classic\">` com um `<li>` fixo mostrando `&APP_USER.` + entradas `#LINK#/#IMAGE#/#TEXT#`. Grid: 12 colunas, `alwaysUseMaxColumns: true`, classes `container`/`row`/`col col-N`. Template option: `js-pageStickyMobileHeader`. Error page template com `#MESSAGE#`, `#ADDITIONAL_INFO#`, `#TECHNICAL_INFO#`, botão `#OK#`.\n\n### 8.3 Region template `cards-container-image-first` (\"Cards Container - Image First\", `custom1`)\nUsado só na Home (p1). HTML:\n```html\n<div class=\"t-CardsRegion #REGION_CSS_CLASSES#\" id=\"#DOM_ID#\" #REGION_LANDMARK_ATTRIBUTES# #REGION_ATTRIBUTES#>\n  <h2 class=\"t-CardsRegion-title\" id=\"#DOM_ID#_heading\" data-apex-heading>#TITLE#<\/h2>\n  <div class=\"t-Region-orderBy\">#ORDER_BY_ITEM#<\/div>\n  #BODY#\n  #SUB_REGIONS#\n<\/div>\n```\nSlots: `regionBody` (BODY), `sortOrder` (ORDER_BY_ITEM, itens/botões), `subRegions`. Template options: `u-colors` (Apply Theme Colors, default), header `t-CardsRegion--hideHeader js-addHiddenHeadingRoleDesc` (preset) ou `t-CardsRegion--removeHeader js-removeLandmark`, estilo `t-CardsRegion--styleA|B|C`. Landmark `region`. É o \"Cards Container\" do UT; a ideia \"image first\" é aplicada por CSS/atributos da região Cards.\n\n### 8.4 Classic report templates (named column, `custom1`) — usados só no Chat (p4)\nA query deve devolver **exatamente** as colunas citadas (nomes em maiúsculas como `#COLUNA#`). Colunas com HTML devem ter `escapeSpecialChars: false`. CSS `.ch-*` está **inline na página 4** (não em arquivo estático).\n\n**`chat-contatos`** — wrapper `<div class=\"ch-contacts\"> ... <\/div>`; linha:\n```html\n#CAB_DEPT#\n<a href=\"javascript:void(0)\" class=\"ch-contact\" data-id=\"#ID_COLABORADOR#\">\n  <span class=\"ch-avatar-wrap\"><span class=\"ch-avatar\">#INICIAIS#<\/span><i class=\"ch-dot ch-dot--#PRESENCA#\"><\/i><\/span>\n  <span class=\"ch-contact-txt\"><b>#NOME_COMPLETO#<\/b><small>#CARGO#<\/small><\/span>\n<\/a>\n```\nColunas: `CAB_DEPT` (HTML `<div class=\"ch-dept\">Depto<\/div>` só na 1ª linha de cada departamento, via `row_number() over (partition by d.nome ...)`), `ID_COLABORADOR` (lido por JS via `data-id`), `INICIAIS`, `PRESENCA` ∈ `online|ausente|offline` (classes `.ch-dot--online/ausente/offline`; calculada de `presenca_colaborador.data_ultimo_ping` 5/30 min), `NOME_COMPLETO`, `CARGO`. O JS marca o selecionado com `.ch-contact.is-active`.\n\n**`chat-mensagens`** — wrapper `<div class=\"ch-msgs\"> ... <\/div>`; linha:\n```html\n#SEP_DIA#\n<div class=\"ch-msg ch-msg--#LADO#\">\n  <div class=\"ch-bubble\"><span class=\"ch-txt\">#CORPO#<\/span><span class=\"ch-time\">#HORA#<\/span><\/div>\n<\/div>\n```\nColunas: `SEP_DIA` (HTML `<div class=\"ch-sep\"><span>HOJE|ONTEM|dd/mm/yyyy<\/span><\/div>` na 1ª mensagem do dia), `LADO` ∈ `out` (enviada por `:APP_USER`) / `in`, `CORPO`, `HORA` (`hh24:mi`). Fonte: `canal_mensagem` filtrado por `:P4_CANAL_ID` e `excluida = false`.\nPaginação dos dois: padrão UT (`#PAGINATION_NEXT#` etc.).\n\n### 8.5 Button template `html-button-legacy-apex-5-migration` (`custom8`)\n`<input type=\"button\" value=\"#LABEL#\" onclick=\"#JAVASCRIPT#\" ...>` — legado, **não usado** em nenhuma página.\n\n---\n\n## 9. Static Application Files (`static-files.apx` + `static-files/`)\n301 arquivos registrados (todos `charSet: utf-8`):\n\n| Arquivo | Uso |\n|---|---|\n| `corlix-tema.css` / `corlix-tema.min.css` | Camada de tema (design system do Figma \"Redwood Light (CorlixHub)\"). Só redefine variáveis do UT (`--ut-*`, `--a-*`) e define tokens **`--cx-*`** (fonte da verdade: `--cx-primaria` = sky-120 `#00688C`, `--cx-primaria-hover`, `--cx-fundo`, `--cx-superficie`, `--cx-borda`, `--cx-texto`, `--cx-raio`, `--cx-raio-card`, `--cx-sucesso`, `--cx-alerta` ...). CSS de módulos (organograma, histórico-carreira) consomem esses tokens. **Novo, não commitado.** |\n| `custom.css` / `custom.min.css` | Ajustes por página: overrides globais do UT, menu lateral (último item vai ao rodapé), header (`.corlix-header__search*`, `__actions`, `__icon-btn`, `__user*`, `__avatar`), card padrão (`.card-default`), Home (`.card-boas-vindas`, `.card-comunicados-oficiais`, `.card-meu-gestor`, `.links-rapidos-card`, `.card-aniversariantes`, `.popup-todos-aniversariantes`, `.figma-row`, `.cx-pessoa`), logs (`.log-descricao`, `.log-detalhe`). Modificado, não commitado. |\n| `default-user.jpeg` | Avatar padrão (fallback em `onerror` e em `APP_USER_FOTO`). |\n| `icons/app-icon-32.png`, `-144-rounded`, `-192`, `-256-rounded`, `-512` | Ícones do app/PWA; login (p9999) usa `#APP_FILES#icons/app-icon-512.png`. |\n| `Fotos Colaboradores/<nome>_<sobrenome>.jpg` (291 arquivos) | Fotos fictícias dos colaboradores (ex.: `aline_alves.jpg`), `image/jpeg`. |\n\nComo referenciar:\n- `#APP_FILES#arquivo.ext` (em HTML, CSS URLs de página/app, SQL que gera HTML). `#MIN#` vira `.min` fora do modo debug (`#APP_FILES#custom#MIN#.css` → `custom.min.css`); **mantenha o par `.css`/`.min.css` sincronizado manualmente** (não há build automático no repo).\n- Fotos: `#APP_FILES#Fotos Colaboradores/` || `COLABORADOR.FOTO_URL` (espera-se `FOTO_URL` = só o nome do arquivo, ex. `aline_alves.jpg`; o espaço na pasta funciona no browser, mas `%20` pode ser necessário em alguns contextos). Sempre adicionar `onerror=\"this.onerror=null;this.src='#APP_FILES#default-user.jpeg';\"`.\n- Docs dos módulos pedem subir `organograma.css` e `historico-carreira.css` como static files — **ainda não registrados** em `static-files.apx`.\n\n---\n\n## 10. Objetos de banco pressupostos (não criados pela app)\nNenhum DDL acompanha a app (sem supporting objects). O `README.md` cita `database/ddl/schema_corlixhub.sql` e `database/seed/seed_corlixhub.sql`, mas **esses arquivos não existem** (`database/` só tem `f100.sql`). Apenas `modulos/historico-carreira/01_ddl_historico_carreira.sql` e `modulos/organograma/organograma.sql` (package `pkg_organograma`) têm DDL/PLSQL. Objetos que os shared components exigem:\n\n| Objeto | Colunas usadas | Por quem |\n|---|---|---|\n| `COLABORADOR` | `id_colaborador`, `login_apex`, `id_cargo`, `id_empresa`, `id_departamento`, `id_gestor`, `foto_url`, `nome_completo`, `primeiro_nome`, `ultimo_nome`, `data_de_nascimento`, `status` (BOOLEAN) | app processes, LOV, Chat, Home |\n| `CARGO` | `id_cargo`, `nome` | `APP_USER_CARGO`, Chat |\n| `EMPRESA` | `id_empresa`, `nome` | `G_NOME_EMPRESA`, LOV |\n| `DEPARTAMENTO` | `id_departamento`, `nome` | LOV, Chat |\n| `PRESENCA_COLABORADOR` | `id_colaborador`, `data_ultimo_ping`, `status_presenca` | template chat-contatos (p4) |\n| `CANAL_MENSAGEM` | `id_canal`, `id_colaborador`, `corpo`, `data_envio`, `excluida` (BOOLEAN) | template chat-mensagens (p4) |\n| `APP_LOG` | `id`, `log_ts` (TIMESTAMP WITH TZ), `nivel` (`ERRO`/`AVISO`/`INFO`), `app_id`, `page_id`, `apex_user`, `session_id`, `origem`, `mensagem`, `detalhe` | Monitor de Logs (p7); presumivelmente escrita por `log_pkg` |\n| `LOG_PKG.APEX_ERROR_HANDLER` | função `(p_error in apex_error.t_error) return apex_error.t_error_result` | error handler da app |\n| `APEX_WORKSPACE_APEX_USERS` | `user_name`, `first_name`, `last_name` | `G_NOME_USUARIO` (view do APEX) |\n\n---\n\n## 11. `log_pkg.apex_error_handler`\nGrep em todo o repositório: `log_pkg` aparece só em `application.apx`, `f100.sql` (linha 115 `p_error_handling_function` e texto da p7), `pages/p00007-monitor-logs.apx` (texto \"mensagens gravadas pelo código com `log_pkg`\") e `modulos/historico-carreira/Etapas-historico-carreira.md` (sugere alterar o handler). **Não há `create package log_pkg` em lugar nenhum.** Se o package não existir no schema, o APEX não consegue chamar o handler e cai no tratamento padrão/erro interno ao exibir qualquer erro. Ao recriar, ele deve gravar em `APP_LOG` e devolver `apex_error.t_error_result` (via `apex_error.init_error_result`).\n\n---\n\n## 12. Pegadinhas e inconsistências (resumo)\n1. **Ordem dos CSS diverge** entre APEXlang (`corlix-tema` → `custom`) e `database/f100.sql` atual (`custom` → `corlix-tema`, linhas ~140–142). O correto, pelo comentário do próprio `corlix-tema.css`, é tema primeiro.\n2.
